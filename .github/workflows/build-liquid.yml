name: Liquid Android — build and visual QA

# Isolated UI fork. Never builds/edits xlox, changes the panel or auto-publishes
# an APK release. Only reviewed artifacts are later attached to a non-latest preview.
on:
  workflow_dispatch:
  push:
    branches: [arena/dda4cc57-anoymundo]
    paths:
      - 'liquid/**'
      - '.github/workflows/build-liquid.yml'

permissions:
  contents: read

concurrency:
  group: liquid-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    defaults:
      run:
        working-directory: liquid
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            liquid/gradle/wrapper/gradle-wrapper.properties
            liquid/build.gradle
            liquid/app/build.gradle
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install artwork checker (never bundled)
        run: python3 -m pip install --disable-pip-version-check -r scripts/icon-requirements.txt
      - name: Original-project isolation, component, contrast and artwork gates
        run: |
          python3 scripts/check_isolation.py
          python3 scripts/ui_quality_gate.py
          python3 scripts/test_vector_paths.py
          python3 scripts/check_branding.py
          python3 scripts/kenny_icons.py --check
          python3 scripts/test_kenny_icons.py
      - name: Blur oracle and unchanged runtime regressions
        run: |
          python3 scripts/test_liquid_blur.py
          python3 scripts/test_runtime_fixes.py
      - name: Install pinned SDK / NDK
        run: |
          set -eu
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SM"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$SM" --sdk_root="$SDK" --install 'platform-tools' 'platforms;android-36' 'build-tools;34.0.0' 'ndk;24.0.8215888'
      - name: Require the original signing identity (no replacement key)
        env:
          XLOX_STORE_PASSWORD: ${{ secrets.XLOX_STORE_PASSWORD }}
        run: |
          test -n "$XLOX_STORE_PASSWORD" || { echo '::error::Existing release signing configuration is unavailable. No unsigned or newly keyed APK will be distributed.'; exit 1; }
          keytool -list -keystore ../xlox/app/xlox.jks -storepass:env XLOX_STORE_PASSWORD -alias key0 >/dev/null
      - name: Assemble BOTH signed release and debug variants
        env:
          XLOX_STORE_PASSWORD: ${{ secrets.XLOX_STORE_PASSWORD }}
          XLOX_KEY_PASSWORD: ${{ secrets.XLOX_KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          mkdir -p ../qa-logs/liquid-build
          ./gradlew :app:assembleAnoyRelease :app:assembleKennyRelease :app:assembleAnoyDebug :app:assembleKennyDebug --no-daemon 2>&1 | tee ../qa-logs/liquid-build/assemble.log
      - name: Android lint (errors fail the build)
        run: |
          set -o pipefail
          ./gradlew :app:lintAnoyRelease :app:lintKennyRelease :app:lintAnoyDebug --no-daemon 2>&1 | tee ../qa-logs/liquid-build/lint.log
      - name: Report actionable build or lint findings
        if: failure()
        run: python3 scripts/ci_evidence.py lint
      - name: Collect brand-specific artifacts
        run: |
          set -eu
          mkdir -p ../dist/liquid ../dist/liquid-debug
          cp app/build/outputs/apk/anoy/release/app-anoy-release.apk ../dist/liquid/Anoy-Liquid.apk
          cp app/build/outputs/apk/kenny/release/app-kenny-release.apk ../dist/liquid/KennyPvt-Liquid.apk
          cp app/build/outputs/apk/anoy/debug/app-anoy-debug.apk ../dist/liquid-debug/Anoy-Liquid-debug.apk
          cp app/build/outputs/apk/kenny/debug/app-kenny-debug.apk ../dist/liquid-debug/KennyPvt-Liquid-debug.apk
          (cd ../dist/liquid && sha256sum Anoy-Liquid.apk KennyPvt-Liquid.apk > SHA256SUMS.txt)
      - name: Verify permissions, compiled brands, SDKs and native alignment
        run: |
          set -eu
          python3 scripts/check_apk_permissions.py ../dist/liquid/Anoy-Liquid.apk ../dist/liquid/KennyPvt-Liquid.apk
          python3 scripts/check_branding.py ../dist/liquid/Anoy-Liquid.apk ../dist/liquid/KennyPvt-Liquid.apk
          python3 scripts/test_runtime_fixes.py ../dist/liquid/Anoy-Liquid.apk ../dist/liquid/KennyPvt-Liquid.apk
          python3 scripts/kenny_icons.py --check --apk ../dist/liquid/KennyPvt-Liquid.apk
          for APK in ../dist/liquid/Anoy-Liquid.apk ../dist/liquid/KennyPvt-Liquid.apk; do
            unzip -p "$APK" lib/arm64-v8a/libXloX.so > /tmp/liquid-libXloX.so
            python3 scripts/check_elf_alignment.py --fail-on-unaligned /tmp/liquid-libXloX.so
          done
      - name: Verify actual release signatures against the original key
        env:
          XLOX_STORE_PASSWORD: ${{ secrets.XLOX_STORE_PASSWORD }}
        run: |
          set -eu
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          EXPECTED=$(keytool -exportcert -keystore ../xlox/app/xlox.jks -storepass:env XLOX_STORE_PASSWORD -alias key0 | sha256sum | cut -d' ' -f1)
          for APK in ../dist/liquid/Anoy-Liquid.apk ../dist/liquid/KennyPvt-Liquid.apk; do
            "$APKSIGNER" verify --verbose "$APK"
            ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            test "$ACTUAL" = "$EXPECTED" || { echo '::error::Original signing certificate mismatch'; exit 1; }
          done
          python3 scripts/check_isolation.py
      - uses: actions/upload-artifact@v7
        with:
          name: Liquid-APKs
          path: dist/liquid/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: Liquid-debug-APKs
          path: dist/liquid-debug/
          if-no-files-found: error
          retention-days: 7
      - name: Upload build / lint evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Liquid-build-reports
          path: |
            qa-logs/liquid-build/
            liquid/app/build/reports/lint-results-*
          if-no-files-found: ignore
          retention-days: 7

  visual-qa:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        api: [23, 33]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r liquid/scripts/icon-requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: Liquid-debug-APKs
          path: qa-apks
      - uses: actions/download-artifact@v7
        with:
          name: Liquid-APKs
          path: qa-apks
      - name: Android tools for temporary emulator copies
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;34.0.0' 'platforms;android-${{ matrix.api }}'
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Offline screen/state/keyboard/accessibility walkthrough
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none -memory 2048
          script: python3 liquid/scripts/liquid_screenshots.py --apks qa-apks --out qa-logs/liquid-api-${{ matrix.api }} --api ${{ matrix.api }}
      - name: Publish concise review images and UI results
        if: always()
        run: python3 liquid/scripts/ci_evidence.py ui --path qa-logs/liquid-api-${{ matrix.api }}
      - name: Upload actual emulator screenshots, view trees and results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Liquid-UI-API-${{ matrix.api }}
          path: qa-logs/liquid-api-${{ matrix.api }}/
          if-no-files-found: warn
          retention-days: 14
