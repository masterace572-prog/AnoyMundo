name: One-time Anoy Mundo SDK36 test

# Isolated opt-in test. Never replaces the original AAR or normal release.
# Input uploads alone do not trigger this workflow. The normal dual-APK
# workflow does not watch these test-only paths.
on:
  workflow_dispatch:
  push:
    branches: [arena/dda4cc57-anoymundo]
    paths:
      - '.github/workflows/anoy-mundo-test.yml'
      - 'test-inputs/mundo/anoy_test.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: anoy-mundo-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify pinned inputs and test-only preparation logic
        run: |
          python3 test-inputs/mundo/anoy_test.py inspect
          python3 test-inputs/mundo/anoy_test.py self-test
          python3 -m pip install --disable-pip-version-check -r xlox/scripts/icon-requirements.txt
          python3 xlox/scripts/ui_quality_gate.py
          python3 xlox/scripts/check_branding.py
          python3 xlox/scripts/kenny_icons.py --check
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            xlox/gradle/wrapper/gradle-wrapper.properties
            xlox/build.gradle
            xlox/app/build.gradle
      - name: Install SDK 36 for the explicitly marked compatibility test
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SM="$(command -v sdkmanager)"
          else
            curl -fsSL -o /tmp/mundo-cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/mundo-cmdtools.zip -d /tmp/mundo-cmdtools
            mkdir -p "$SDK/cmdline-tools/latest"
            cp -r /tmp/mundo-cmdtools/cmdline-tools/. "$SDK/cmdline-tools/latest/"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$SM" --sdk_root="$SDK" --list --channel=3 > /tmp/mundo-sdk-catalog.log 2>&1
          "$SM" --sdk_root="$SDK" --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;24.0.8215888' > /tmp/mundo-sdk.log 2>&1
      - name: Prepare only this runner's Anoy compatibility test
        run: |
          echo "::warning title=SDK 36 compatibility experiment::SDK 37 is unavailable. Only this isolated test excludes the AAR-metadata task; the uploaded AAR is unchanged. This is not SDK-37-validated."
          python3 test-inputs/mundo/anoy_test.py prepare
      - name: Build and lint Anoy only (no signing secrets in this job)
        working-directory: xlox
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleAnoyRelease -x :app:checkAnoyReleaseAarMetadata --no-daemon > /tmp/mundo-build.log 2>&1
          ./gradlew :app:lintAnoyRelease -x :app:checkAnoyReleaseAarMetadata --no-daemon > /tmp/mundo-lint.log 2>&1
      - name: Collect and verify the unsigned test APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          apks = list(Path('xlox/app/build/outputs/apk/anoy/release').glob('*.apk'))
          assert len(apks) == 1, 'Expected exactly one Anoy APK'
          shutil.copyfile(apks[0], 'dist/Anoy-Mundo-LV10-SDK36-test-unsigned.apk')
          PY
          python3 test-inputs/mundo/anoy_test.py verify-apk dist/Anoy-Mundo-LV10-SDK36-test-unsigned.apk
          (cd xlox && python3 scripts/check_apk_permissions.py ../dist/Anoy-Mundo-LV10-SDK36-test-unsigned.apk)
          python3 test-inputs/mundo/anoy_test.py inspect
      - name: Readable build failure annotations
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          catalog = Path('/tmp/mundo-sdk-catalog.log')
          if catalog.exists():
              platforms = '\n'.join(line.strip() for line in catalog.read_text(errors='replace').splitlines() if 'platforms;android-' in line)[-6000:]
              print('::notice title=Available Android SDK platforms::' + platforms.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          for name in ('sdk', 'build', 'lint'):
              log = Path('/tmp/mundo-' + name + '.log')
              if log.exists():
                  tail = '\n'.join(log.read_text(errors='replace').splitlines()[-55:])[-6500:]
                  print('::error title=Mundo test ' + name + '::' + tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: Anoy-Mundo-test-unsigned
          path: |
            dist/Anoy-Mundo-LV10-SDK36-test-unsigned.apk
            dist/MUNDO-TEST-INPUTS.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload Anoy lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Anoy-Mundo-test-lint
          path: xlox/app/build/reports/lint-results-*
          retention-days: 7
          if-no-files-found: ignore

  sign-and-share-test:
    needs: build-unsigned
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install signing and APK-inspection tools
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SM="$(command -v sdkmanager)"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$SM" --sdk_root="$SDK" --install 'build-tools;36.0.0'
      - uses: actions/download-artifact@v7
        with:
          name: Anoy-Mundo-test-unsigned
          path: dist
      - name: Recheck unsigned input before accessing signing credentials
        run: |
          python3 test-inputs/mundo/anoy_test.py verify-apk dist/Anoy-Mundo-LV10-SDK36-test-unsigned.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/zipalign" -P 16 -f 4 dist/Anoy-Mundo-LV10-SDK36-test-unsigned.apk dist/Anoy-Mundo-LV10-SDK36-test-aligned.apk
      - name: Sign with the existing Anoy key (never regenerate)
        env:
          XLOX_STORE_PASSWORD: ${{ secrets.XLOX_STORE_PASSWORD }}
          XLOX_KEY_PASSWORD: ${{ secrets.XLOX_KEY_PASSWORD }}
        run: |
          test -n "$XLOX_STORE_PASSWORD" || { echo '::error::Existing Anoy signing secret is required; no unsigned test will be published.'; exit 1; }
          export XLOX_EFFECTIVE_KEY_PASSWORD="${XLOX_KEY_PASSWORD:-$XLOX_STORE_PASSWORD}"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" sign \
            --ks xlox/app/xlox.jks --ks-key-alias key0 \
            --ks-pass env:XLOX_STORE_PASSWORD --key-pass env:XLOX_EFFECTIVE_KEY_PASSWORD \
            --out dist/Anoy-Mundo-LV10-SDK36-test.apk dist/Anoy-Mundo-LV10-SDK36-test-aligned.apk
      - name: Verify signed APK, alignment and unchanged Anoy signer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TOOL="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          "$TOOL/apksigner" verify --verbose --print-certs dist/Anoy-Mundo-LV10-SDK36-test.apk > /tmp/mundo-test-signer.txt
          "$TOOL/zipalign" -P 16 -c 4 dist/Anoy-Mundo-LV10-SDK36-test.apk
          python3 test-inputs/mundo/anoy_test.py verify-apk dist/Anoy-Mundo-LV10-SDK36-test.apk
          (cd xlox && python3 scripts/check_apk_permissions.py ../dist/Anoy-Mundo-LV10-SDK36-test.apk)
          mkdir -p /tmp/mundo-stable-reference
          gh release download loaders-v2.4.2-20 --pattern Anoy-XLOX-loader.apk --dir /tmp/mundo-stable-reference
          "$TOOL/apksigner" verify --print-certs /tmp/mundo-stable-reference/Anoy-XLOX-loader.apk > /tmp/mundo-stable-signer.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          def signer(path):
              match = re.search(r'Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]+)', Path(path).read_text())
              assert match, 'Signer certificate missing'
              return match[1].lower()
          assert signer('/tmp/mundo-test-signer.txt') == signer('/tmp/mundo-stable-signer.txt'), 'Anoy signing certificate changed'
          print('PASS: test APK and stable Anoy have the same verified signing certificate')
          PY
          (cd dist && sha256sum Anoy-Mundo-LV10-SDK36-test.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: Anoy-Mundo-LV10-SDK36-test
          path: |
            dist/Anoy-Mundo-LV10-SDK36-test.apk
            dist/MUNDO-TEST-INPUTS.json
            dist/SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
      - name: Share a distinctly named, non-latest TEST prerelease only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          TEST_TAG="anoy-mundo-lv10-sdk36-test-${GITHUB_SHA:0:8}"
          STABLE_BEFORE=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          printf '%s\n' \
            'EXPERIMENTAL SDK 36 COMPATIBILITY TEST ONLY — not a production update.' '' \
            'Uses the uploaded mundo-release-lv10_cracked.aar without changing/deleting the original AAR.' \
            'Input SHA-256: 404536acf645805c4843aefce5061b43d32c82e6e4bd6d32219bb43047c67473' \
            'Package: com.xlox; version: 2.4.2-mundo-lv10-sdk36-test (20); compile SDK 36, minimum 21, target 28.' \
            'The AAR declares SDK 37, unavailable in both SDK catalogs. Only this test excludes checkAnoyReleaseAarMetadata. Neither AAR is modified. NOT SDK-37-validated.' \
            'Signed with the unchanged Anoy certificate. Installing replaces Anoy on that phone; this is not a side-by-side package.' \
            'Use a spare test device. Static/build verification is not a malware audit or a physical-device test.' \
            'No panel library or live APK-update selection is changed. Stable releases and Kenny are untouched.' \
            "Source commit: $GITHUB_SHA" '' > /tmp/mundo-test-release-notes.md
          cat dist/SHA256SUMS.txt >> /tmp/mundo-test-release-notes.md
          gh release create "$TEST_TAG" \
            dist/Anoy-Mundo-LV10-SDK36-test.apk dist/MUNDO-TEST-INPUTS.json dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title 'TEST ONLY: Anoy / Mundo LV10 (SDK36 compatibility)' \
            --prerelease --latest=false --notes-file /tmp/mundo-test-release-notes.md
          STABLE_AFTER=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          test "$STABLE_BEFORE" = "$STABLE_AFTER" || { echo '::error::Stable latest release changed unexpectedly'; exit 1; }
          echo "Test prerelease: $TEST_TAG. Stable latest remains $STABLE_AFTER."
