name: Extract Techpost Lottie source

# One-time source retrieval for the exact animation selected for the Anoy splash.
# The output is emitted in log chunks so it can be checked into the Android app
# as a normal, offline raw resource. This workflow is removed after retrieval.
on:
  push:
    branches: [arena/ef830848-anoymundo]
    paths:
      - '.github/workflows/extract-techpost-lottie.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Download, validate and commit the selected animation
        shell: bash
        run: |
          set -euo pipefail
          url='https://assets-v2.lottiefiles.com/a/ca75e6e6-1808-11ee-a221-ef9a4cc4b613/zPk1JbJUf9.lottie'
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --connect-timeout 20 --max-time 60 --output /tmp/techpost.lottie "$url"
          entry=$(unzip -Z1 /tmp/techpost.lottie | grep -E '^animations/[^/]+\.json$' | head -1)
          test -n "$entry"
          mkdir -p xlox/app/src/main/res/raw
          unzip -p /tmp/techpost.lottie "$entry" > xlox/app/src/main/res/raw/anoy_splash_techpost.json
          python3 -c 'import json,sys; a=json.load(open(sys.argv[1])); assert all(k in a for k in ("v", "fr", "ip", "op", "w", "h", "layers"))' xlox/app/src/main/res/raw/anoy_splash_techpost.json
          echo "Retrieved $entry ($(wc -c <xlox/app/src/main/res/raw/anoy_splash_techpost.json) bytes)"
          git diff --quiet -- xlox/app/src/main/res/raw/anoy_splash_techpost.json && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add xlox/app/src/main/res/raw/anoy_splash_techpost.json
          git commit -m 'chore: add selected Techpost splash Lottie [skip ci]'
          git push
