name: Liquid Android — manually share verified preview

# Publication is opt-in and separate from the read-only build. Definition-only
# pushes never publish. An explicitly changed, reviewed request file is the
# auditable alternative when this connection cannot use workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Successful Liquid build + BOTH emulator jobs run ID'
        required: true
        type: string
      source_sha:
        description: 'Full 40-character commit built by that successful run'
        required: true
        type: string
      confirm_preview:
        description: 'Share a non-latest UI PREVIEW only; do not select it in the live panel'
        required: true
        type: boolean
        default: false
  push:
    branches: [arena/dda4cc57-anoymundo]
    paths: ['.github/workflows/publish-liquid-preview.yml', '.github/liquid-preview-request.json']

permissions:
  contents: read
  actions: read

concurrency:
  group: liquid-preview-publication
  cancel-in-progress: false

jobs:
  definition:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Confirm that source build remains isolated
        run: python3 liquid/scripts/check_isolation.py
      - name: Check publication guards without network or release side effects
        run: python3 .github/scripts/test_liquid_publication.py

  verify-request:
    if: github.ref == 'refs/heads/arena/dda4cc57-anoymundo'
    needs: definition
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      approved: ${{ steps.request.outputs.approved }}
      source_run: ${{ steps.request.outputs.source_run }}
      source_sha: ${{ steps.request.outputs.source_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REQUEST_RUN: ${{ inputs.source_run }}
      REQUEST_SHA: ${{ inputs.source_sha }}
      REQUEST_CONFIRM: ${{ inputs.confirm_preview && 'true' || 'false' }}
      PUSH_BEFORE: ${{ github.event.before }}
    steps:
      - name: Refuse unreviewed requests, untested runs, changed source or any other branch
        id: request
        run: |
          python3 - <<'PY'
          import base64, json, os, re, subprocess
          from pathlib import Path
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + os.environ['GH_REPO'] + path]))
          def main():
              if os.environ['GITHUB_EVENT_NAME'] == 'push':
                  before = os.environ['PUSH_BEFORE']
                  assert re.fullmatch(r'[0-9a-f]{40}', before) and int(before, 16), 'Existing branch history required'
                  changes = api('/compare/' + before + '...' + os.environ['GITHUB_SHA'])
                  assert changes['status'] == 'ahead' and changes['behind_by'] == 0
                  assert len(changes.get('files', [])) < 300 and changes['total_commits'] < 250, 'Refuse truncated comparisons'
                  request_path = '.github/liquid-preview-request.json'
                  if not any(f['filename'] == request_path and f['status'] != 'removed' for f in changes.get('files', [])):
                      print('Definition-only push: no changed publication request; nothing will be published')
                      return
                  entry = api('/contents/' + request_path + '?ref=' + os.environ['GITHUB_SHA'])
                  assert entry['encoding'] == 'base64'
                  request = json.loads(base64.b64decode(entry['content']))
                  assert set(request) == {'source_run', 'source_sha', 'confirm_preview', 'ui_reviewed'}
                  assert request['confirm_preview'] is True and request['ui_reviewed'] is True, 'Explicit review and preview confirmation required'
                  run, sha = str(request['source_run']), request['source_sha']
              else:
                  assert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
                  if os.environ['REQUEST_CONFIRM'] != 'true':
                      print('No preview confirmation: nothing will be published')
                      return
                  run, sha = os.environ['REQUEST_RUN'], os.environ['REQUEST_SHA']
              assert re.fullmatch(r'[0-9]+', run), 'Invalid run ID'
              assert isinstance(sha, str) and re.fullmatch(r'[0-9a-f]{40}', sha), 'Full source SHA required'
              built = api('/actions/runs/' + run)
              assert built['path'] == '.github/workflows/build-liquid.yml', 'Not the Liquid build workflow'
              assert built['head_sha'] == sha and built['head_branch'] == 'arena/dda4cc57-anoymundo'
              assert built['status'] == 'completed' and built['conclusion'] == 'success', 'All build and emulator jobs must pass'
              jobs = api('/actions/runs/' + run + '/jobs')['jobs']
              for name in ('build', 'visual-qa (23)', 'visual-qa (33)'):
                  assert any(j['name'] == name and j['conclusion'] == 'success' for j in jobs), 'Missing successful job: ' + name
              diff = api('/compare/' + sha + '...' + os.environ['GITHUB_SHA'])
              assert diff['status'] in ('ahead', 'identical') and diff['behind_by'] == 0
              assert len(diff.get('files', [])) < 300 and diff['total_commits'] < 250, 'Refuse truncated comparisons'
              assert not any(f['filename'].startswith('liquid/') or f['filename'] == '.github/workflows/build-liquid.yml' for f in diff.get('files', [])), 'Liquid source changed since tested build'
              artifacts = api('/actions/runs/' + run + '/artifacts')['artifacts']
              for name in ('Liquid-APKs', 'Liquid-UI-API-23', 'Liquid-UI-API-33'):
                  assert any(a['name'] == name and not a['expired'] and a['size_in_bytes'] > 0 for a in artifacts), 'Missing retained artifact: ' + name
              with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
                  output.write('approved=true\nsource_run=' + run + '\nsource_sha=' + sha + '\n')
              print('PASS: explicit request, exact Liquid source, branch, signed build and both emulator jobs verified')
          main()
          PY

  publish:
    if: needs.verify-request.outputs.approved == 'true'
    needs: verify-request
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_RUN: ${{ needs.verify-request.outputs.source_run }}
      SOURCE_SHA: ${{ needs.verify-request.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v7
        with:
          name: Liquid-APKs
          path: dist/liquid
          run-id: ${{ needs.verify-request.outputs.source_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v7
        with:
          pattern: Liquid-UI-API-*
          path: qa-evidence
          run-id: ${{ needs.verify-request.outputs.source_run }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install --disable-pip-version-check -r liquid/scripts/icon-requirements.txt
      - name: Independently verify untouched release assets and original certificate
        env:
          XLOX_STORE_PASSWORD: ${{ secrets.XLOX_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          python3 liquid/scripts/check_isolation.py
          (cd dist/liquid && sha256sum -c SHA256SUMS.txt)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;34.0.0'
          EXPECTED=$(keytool -exportcert -keystore xlox/app/xlox.jks -storepass:env XLOX_STORE_PASSWORD -alias key0 | sha256sum | cut -d' ' -f1)
          test "${#EXPECTED}" -eq 64
          for APK in dist/liquid/Anoy-Liquid.apk dist/liquid/KennyPvt-Liquid.apk; do
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
            ACTUAL=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            test "$ACTUAL" = "$EXPECTED" || { echo '::error::Release certificate mismatch'; exit 1; }
          done
      - name: Preserve credential-free screen evidence without storing binaries in Git
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import json
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          root = Path('qa-evidence')
          for api in (23, 33):
              data = json.loads((root / f'Liquid-UI-API-{api}/results.json').read_text())
              assert len(data['screens']) >= 50 and all(c['pass'] for c in data['checks'])
          with ZipFile('dist/liquid/Liquid-UI-evidence.zip', 'w', ZIP_DEFLATED) as archive:
              archive.writestr('README.txt', 'Actual offline Android 6 / 13 emulator UI fixtures. No native game, real phone, provider login or performance validation. No APKs or raw logs are included. All displayed licence data is fictitious.\n')
              for path in sorted(root.rglob('*')):
                  if path.is_file() and (path.suffix in ('.png', '.xml') or path.name == 'results.json'):
                      archive.write(path, path.relative_to(root))
          files = [('anoy-login', 'Sign in'), ('anoy-home', 'Home'), ('anoy-settings', 'Settings'),
                   ('anoy-library-required', 'Library update'), ('anoy-apk-update-normal', 'App update'),
                   ('kenny-splash', 'KennyPvt startup')]
          page = Image.new('RGB', (924, 1472), '#080D17')
          draw = ImageDraw.Draw(page)
          font = ImageFont.load_default(size=18)
          draw.text((22, 20), 'Liquid | actual native Android UI', fill='#F5F7FC', font=ImageFont.load_default(size=26))
          draw.text((22, 57), 'Offline emulator captures - not a web mockup or real-device game test', fill='#B8C4D8', font=font)
          for i, (name, label) in enumerate(files):
              frame = Image.open(root / 'Liquid-UI-API-33' / (name + '.png')).convert('RGB')
              frame = ImageOps.contain(frame, (284, 632))
              x, y = 18 + (i % 3) * 306, 105 + (i // 3) * 678
              draw.text((x, y), label, fill='#F5F7FC', font=font)
              page.paste(frame, (x + (284-frame.width)//2, y+30))
          page.save('dist/liquid/Liquid-UI-preview.png', optimize=True)
          PY
          (cd dist/liquid && sha256sum Liquid-UI-evidence.zip Liquid-UI-preview.png >> SHA256SUMS.txt)
      - name: Share only the named non-latest preview; retain stable assets
        run: |
          set -euo pipefail
          TAG="liquid-v2.5.0-21-${SOURCE_SHA:0:8}"
          LATEST_BEFORE=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          gh api "repos/$GH_REPO/releases?per_page=100" > /tmp/liquid-releases-before.json
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo '::error::That preview already exists; assets will never be overwritten.'
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          import os
          text = '''# Liquid native Android UI preview

          Both brands: **2.5.0-liquid / code 21**, arm64-v8a, min 21 / target 28.
          Full native Java/XML UI redesign in `liquid/`; original `xlox/` unchanged.
          Includes the new splash, typography, icons, sign-in, home, Settings,
          glass/opaque appearance option, library/APK updates and shared sheets.

          **Optional in-place update, not a side-by-side app.** Keep app/game data.
          Uses the original signing certificate and existing package IDs. Do not
          uninstall or clear data. Code 21 permits returning to retained 2.4.3/code 21;
          Android normally blocks a downgrade to panel-linked 2.4.2/code 20.

          Build, lint, signatures, branding, download/runtime regressions and API 23/33
          offline emulator UI walkthroughs passed. Emulator tests use temporary,
          re-signed ABI-neutral UI copies, not the distributed native APKs.
          They do NOT prove physical-phone game/container operation, provider login,
          OEM permissions, API-21 runtime or frame-rate/battery performance.
          The cancelled login experiment is not fixed or resumed by this preview.

          `Liquid-UI-preview.png` contains actual native screenshots. The evidence ZIP
          retains all captured states and view trees; it includes no APKs or raw logs.

          This is a **prerelease, not latest**. No live panel APK/library selection,
          site, account, licence or production database is changed.
          '''
          text += '\nSource: `' + os.environ['SOURCE_SHA'] + '`\n'
          text += 'Checks/screenshots: https://github.com/' + os.environ['GH_REPO'] + '/actions/runs/' + os.environ['SOURCE_RUN'] + '\n\n'
          text += '```text\n' + Path('dist/liquid/SHA256SUMS.txt').read_text() + '```\n'
          Path('/tmp/liquid-preview-notes.md').write_text(text)
          PY
          gh release create "$TAG" dist/liquid/Anoy-Liquid.apk dist/liquid/KennyPvt-Liquid.apk dist/liquid/SHA256SUMS.txt dist/liquid/Liquid-UI-evidence.zip dist/liquid/Liquid-UI-preview.png --target "$SOURCE_SHA" --title 'PREVIEW: Anoy + KennyPvt Liquid UI 2.5.0' --prerelease --latest=false --notes-file /tmp/liquid-preview-notes.md >/tmp/liquid-preview-publish.log 2>&1
          test "$LATEST_BEFORE" = "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)"
          gh api "repos/$GH_REPO/releases?per_page=100" > /tmp/liquid-releases-after.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          def stable(path):
              releases = json.loads(Path(path).read_text())
              return {r['id']: [(a['id'], a['name'], a['size'], a.get('digest')) for a in r['assets']] for r in releases if not r['prerelease']}
          assert stable('/tmp/liquid-releases-before.json') == stable('/tmp/liquid-releases-after.json'), 'Stable assets changed'
          print('PASS: stable release assets and latest pointer unchanged')
          PY
          echo "::notice title=Liquid preview shared::https://github.com/$GH_REPO/releases/tag/$TAG"
      - name: Report concise sanitized sharing failure
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          from urllib.parse import urlsplit, urlunsplit
          path = Path('/tmp/liquid-preview-publish.log')
          text = path.read_text(errors='replace')[-3000:] if path.exists() else 'Publication failed before release creation; inspect the failed step.'
          token = os.environ.get('GH_TOKEN', '')
          if token:
              text = text.replace(token, '[redacted]')
          def no_query(match):
              url = urlsplit(match.group())
              return urlunsplit((url.scheme, url.netloc, url.path, '', ''))
          text = re.sub(r'https?://[^\s)]+', no_query, text)
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Liquid preview publication::' + text)
          PY
