name: Build XLOX loader APK

# Builds the Anoy-integrated XLOX loader on GitHub-hosted runners (the sandbox
# has no Android SDK). Produces a signed release APK + a starter loader ZIP.
on:
  workflow_dispatch:
    inputs:
      publish_loader_zip:
        description: 'Publish the starter loader ZIP to the live panel (/lib)'
        type: boolean
        default: false
      panel_version:
        description: 'Version string to publish (only used when publishing)'
        type: string
        default: '1.0.0'
  push:
    branches: [arena/b2fac70f-anoymundo]
    paths:
      - 'xlox/**'
      - '.github/workflows/build-xlox.yml'

permissions:
  contents: write

concurrency:
  group: build-xlox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        working-directory: xlox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            xlox/gradle/wrapper/gradle-wrapper.properties
            xlox/build.gradle
            xlox/app/build.gradle

      # ubuntu-24.04 images already ship an Android SDK. Avoid the third-party
      # setup action (it breaks on the new runner images); install cmdline-tools
      # ourselves only when neither ANDROID_HOME nor sdkmanager is available.
      - name: Install SDK platform, build-tools and pinned NDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          mkdir -p "$SDK"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SM="$(command -v sdkmanager)"
          else
            echo "Installing Android command line tools"
            curl -fsSL -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf /tmp/cmdtools && mkdir -p /tmp/cmdtools
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mkdir -p "$SDK/cmdline-tools/latest"
            cp -r /tmp/cmdtools/cmdline-tools/. "$SDK/cmdline-tools/latest/"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SM" --sdk_root="$SDK" --install "platform-tools" "platforms;android-34" \
                                           "build-tools;34.0.0" "ndk;24.0.8215888"
          test -x "$SDK/ndk/24.0.8215888/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          "$SM" --sdk_root="$SDK" --list_installed | grep -E 'android-34|34\.0\.0|24\.0\.8215888'

      - name: Verify / regenerate the release keystore
        run: |
          if ! keytool -list -keystore app/xlox.jks -storepass 11111111 -alias key0 >/dev/null 2>&1; then
            echo "Bundled keystore unusable; generating a local release keystore"
            keytool -genkeypair -v -keystore app/xlox.jks \
              -storepass 11111111 -keypass 11111111 -alias key0 \
              -keyalg RSA -keysize 2048 -validity 10000 -storetype PKCS12 \
              -dname "CN=Anoy XLOX, OU=Anoy, O=Anoy, L=Amritsar, ST=Punjab, C=IN"
          fi
          keytool -list -keystore app/xlox.jks -storepass 11111111 -alias key0 | head -4

      - name: Assemble signed release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -x lintVitalRelease

      - name: Build starter loader ZIP (arm64-v8a libbgmi.so)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          CLANG="$SDK/ndk/24.0.8215888/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          test -x "$CLANG" || { echo "NDK clang not found at $CLANG"; exit 1; }
          "$CLANG" -shared -fPIC -O2 -o libbgmi.so loader-stub/bgmi_stub.c -llog
          head -c 4 libbgmi.so | od -An -tx1
          zip -j xlox-loader.zip libbgmi.so
          unzip -l xlox-loader.zip

      - name: Collect deliverables
        run: |
          mkdir -p ../dist
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK" || { echo "No APK produced"; exit 1; }
          cp "$APK" ../dist/Anoy-XLOX-loader.apk
          cp xlox-loader.zip ../dist/xlox-loader.zip
          ls -lh ../dist
          echo "APK_SHA256=$(sha256sum ../dist/Anoy-XLOX-loader.apk | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Assert the APK really contains the native panel library
        run: |
          unzip -l ../dist/Anoy-XLOX-loader.apk | grep -F 'libXloX.so' || {
            echo "libXloX.so is missing from the APK"; exit 1; }
          unzip -l ../dist/Anoy-XLOX-loader.apk | grep -E 'META-INF/.*\.(RSA|SF)' \
            || echo "v2/v3 signature only (no v1 jar signature, still valid)"
          test -f ../dist/xlox-loader.zip
          echo "APK sha256 = $APK_SHA256"

      - name: Upload APK and loader ZIP
        uses: actions/upload-artifact@v4
        with:
          name: xlox-apk
          path: |
            dist/Anoy-XLOX-loader.apk
            dist/xlox-loader.zip
          retention-days: 30
          if-no-files-found: error

      # The sandbox cannot reach actions artifact storage, so also publish a
      # durable download link and place the deliverables on this branch.
      - name: Publish APK as a GitHub release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="xlox-v1.0.0-run${{ github.run_number }}"
          gh release create "$TAG" \
            dist/Anoy-XLOX-loader.apk dist/xlox-loader.zip \
            --title "Anoy XLOX loader – build ${{ github.run_number }}" \
            --notes "Signed arm64-v8a release APK built from ${{ github.sha }}. APK sha256: $APK_SHA256" \
            || echo "Release $TAG already exists, artifacts remain attached to the workflow run"

      - name: Commit deliverables to the working branch
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/Anoy-XLOX-loader.apk dist/xlox-loader.zip
          git diff --cached --quiet && { echo "No deliverable changes"; exit 0; }
          git commit -m "Add built XLOX loader APK (build ${{ github.run_number }}) [skip ci]"
          git push origin HEAD:arena/b2fac70f-anoymundo

      - name: Check the panel lib + version endpoints
        run: |
          BASE="https://anoymundo-panel.vercel.app"
          printf 'version endpoint: '; curl -sS --max-time 30 "$BASE/api/lib/version" | tr -d '\n'; echo
          curl -sS --max-time 30 -o /tmp/panel-lib.bin \
            -w 'download endpoint: HTTP %{http_code}, %{content_type}, %{size_download} bytes\n' \
            "$BASE/api/lib/download" || true

      - name: Publish starter loader ZIP to the panel
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_loader_zip }}
        env:
          PANEL_BASE_URL: https://anoymundo-panel.vercel.app
          PANEL_ADMIN_USERNAME: admin
          PANEL_ADMIN_PASSWORD: ${{ secrets.PANEL_ADMIN_PASSWORD }}
        run: |
          node scripts/publish-release.mjs ../dist/xlox-loader.zip \
            "${{ inputs.panel_version }}"

      - name: Done
        run: echo "XLOX APK built from ${{ github.sha }}"
