name: Build Anoy and KennyPvt APKs

# One workflow, two separately installable branded APKs. Publishing an APK to
# GitHub NEVER changes either owner's panel library or live APK-update choice.
# No automatic pruning: either channel may still point at an older release/tag.
# The explicit 2.4.3 backup input / [verify-2.4.3] push archives assets only.
# That verify-only marker also disables publishing; it never replaces a release.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Attach both signed APKs to a GitHub release'
        type: boolean
        default: true
      backup_replaced_243:
        description: 'Build-only: archive the old 2.4.3 (21) assets before its owner-requested replacement'
        type: boolean
        default: false
  push:
    branches: [main, arena/dda4cc57-anoymundo]
    paths:
      - 'xlox/**'
      - 'web/**'
      - 'supabase/**'
      - '.github/workflows/build-xlox.yml'

permissions:
  contents: write

concurrency:
  group: build-loaders-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panel-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build && npm test
      - name: Generated templates must match their source
        run: git diff --exit-code -- src/templates.generated.mjs

  build:
    needs: panel-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: xlox
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned artwork-check dependency (not bundled in APKs)
        run: python3 -m pip install --disable-pip-version-check -r scripts/icon-requirements.txt
      - name: Static UI, artwork and two-brand isolation gates
        run: |
          python3 scripts/ui_quality_gate.py
          python3 scripts/check_branding.py
          python3 scripts/kenny_icons.py --check
          python3 scripts/test_kenny_icons.py

      - name: Back up old 2.4.3 assets (explicit build-only request)
        if: (github.event_name == 'workflow_dispatch' && inputs.backup_replaced_243) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-2.4.3]'))
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_REQUESTED: ${{ inputs.publish_release || false }}
        run: |
          set -eu
          [ "$PUBLISH_REQUESTED" = false ] || { echo '::error::Backup mode must be build-only.'; exit 1; }
          mkdir -p prior-release-backup
          gh api repos/${{ github.repository }}/releases/tags/loaders-v2.4.3-21 > prior-release-backup/release.json
          gh api repos/${{ github.repository }}/git/ref/tags/loaders-v2.4.3-21 > prior-release-backup/tag.json
          python3 - <<'PYBACKUP'
          import json
          from pathlib import Path
          release = json.loads(Path('prior-release-backup/release.json').read_text())
          # This UI refresh replaces the already-rebuilt release, NOT the
          # historical 453635973 release archived by the previous iteration.
          assert release['id'] == 456878910, 'Current 2.4.3 release changed; stop for review.'
          expected_source = '9ae21239f12278ffc895d3b18b0fe679865ace49'
          assert release['target_commitish'] == expected_source, 'Release source changed.'
          tag = json.loads(Path('prior-release-backup/tag.json').read_text())
          assert tag['object']['type'] == 'commit' and tag['object']['sha'] == expected_source, 'Tag changed.'
          expected = {
              'Anoy-XLOX-loader.apk': (5295800, 'dfe2519352d6e366d637dcb9d3455ab0e9af095378d134f71b0c33eaf64132c4'),
              'KennyPvt-loader.apk': (7908720, '3d1942a47fd21ac66437d9884b13c09cd0830fa1de6b1266cee3e1a663026e6e'),
              'SHA256SUMS.txt': (173, '0630acd501c22c508cfdba0f2cdcd06015d709223d69cdc54a7108f4cbc8e4cc'),
          }
          assert {asset['name'] for asset in release['assets']} == set(expected), 'Asset set changed.'
          for asset in release['assets']:
              size, digest = expected[asset['name']]
              assert asset['size'] == size and asset['digest'] == 'sha256:' + digest, 'Asset changed: ' + asset['name']
          PYBACKUP
          gh release download loaders-v2.4.3-21 --dir prior-release-backup
          python3 - <<'PYBACKUP'
          import hashlib, json
          from pathlib import Path
          backup = Path('prior-release-backup')
          release = json.loads((backup / 'release.json').read_text())
          for asset in release['assets']:
              path = backup / asset['name']
              digest = 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
              assert path.stat().st_size == asset['size'], asset['name'] + ': size mismatch'
              assert digest == asset['digest'], asset['name'] + ': checksum mismatch'
              print('Verified old release backup:', asset['name'], digest)
          PYBACKUP

      - name: Retain verified prior-release backup (no source or release changes)
        if: (github.event_name == 'workflow_dispatch' && inputs.backup_replaced_243) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-2.4.3]'))
        uses: actions/upload-artifact@v7
        with:
          name: prior-release-2.4.3-21-backup
          path: prior-release-backup/
          retention-days: 90
          if-no-files-found: error

      - name: Read the common version
        run: |
          NAME=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\1/p" app/build.gradle | head -1)
          CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' app/build.gradle | head -1)
          [ -n "$NAME" ] && [ -n "$CODE" ] || { echo '::error::Missing app version'; exit 1; }
          echo "APP_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=loaders-v$NAME-$CODE" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            xlox/gradle/wrapper/gradle-wrapper.properties
            xlox/build.gradle
            xlox/app/build.gradle

      - name: Game login routing and cancellable update transport regressions
        run: python3 scripts/test_runtime_fixes.py

      - name: Install the SDK and pinned NDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          mkdir -p "$SDK"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SM="$(command -v sdkmanager)"
          else
            curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mkdir -p "$SDK/cmdline-tools/latest"
            cp -r /tmp/cmdtools/cmdline-tools/. "$SDK/cmdline-tools/latest/"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SM" --sdk_root="$SDK" --install 'platform-tools' 'platforms;android-36' 'build-tools;34.0.0' 'ndk;24.0.8215888'

      - name: Check release signing (never regenerate Anoy's key)
        env:
          XLOX_STORE_PASSWORD: ${{ secrets.XLOX_STORE_PASSWORD }}
        run: |
          if [ -z "$XLOX_STORE_PASSWORD" ]; then
            echo '::warning::Signing secret missing. Both APKs will be checked and uploaded as UNSIGNED artifacts; no release will be published.'
            echo 'XLOX_SIGNED=false' >> "$GITHUB_ENV"
          else
            keytool -list -keystore app/xlox.jks -storepass:env XLOX_STORE_PASSWORD -alias key0 >/dev/null
            echo 'XLOX_SIGNED=true' >> "$GITHUB_ENV"
          fi

      - name: Host runtime preparation regressions (offline fixtures)
        run: python3 -B scripts/test_prepare_robolectric.py

      - name: Restore pinned host Android runtimes
        id: host-runtime-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/xlox-robolectric
          key: ${{ runner.os }}-robolectric-4.14.1-i7-api21-28-35-v1

      - name: Prepare checksum-verified host Android runtimes
        run: |
          python3 -B scripts/prepare_robolectric.py --dir "$HOME/.cache/xlox-robolectric"
          echo "XLOX_ROBOLECTRIC_DIR=$HOME/.cache/xlox-robolectric" >> "$GITHUB_ENV"

      - name: Save verified host runtimes before running tests
        if: steps.host-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/xlox-robolectric
          key: ${{ runner.os }}-robolectric-4.14.1-i7-api21-28-35-v1

      - name: Android navigation view regressions for BOTH brands
        run: |
          set +e
          ./gradlew :app:testAnoyDebugUnitTest :app:testKennyDebugUnitTest --no-daemon > /tmp/navigation-tests.log 2>&1
          rc=$?
          cat /tmp/navigation-tests.log
          python3 - <<'PYNAV'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          totals = {'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          suites = {}
          for report in sorted(Path('app/build/test-results').rglob('TEST-*.xml')):
              suite = ET.parse(report).getroot()
              counts = {key: int(suite.get(key, '0')) for key in totals}
              suites[(report.parent.name, suite.get('name'))] = counts
              for key in totals:
                  totals[key] += counts[key]
              print('Navigation test report:', report, counts)
              for case in suite.findall('testcase'):
                  for failure in list(case.findall('failure')) + list(case.findall('error')):
                      trace = failure.text or ''
                      causes = '\n'.join(line for line in trace.splitlines() if 'Caused by:' in line or 'https://' in line)
                      detail = case.get('name', '') + ': ' + (failure.get('message') or '')[:600]
                      detail += '\n' + causes[:1800] + '\n' + trace[-1400:]
                      print('::error title=Android navigation test::' + detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          summary = 'Android UI/OBB tests (Anoy + KennyPvt, host Android 21 / 28): ' + str(totals)
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(summary + '\n')
          expected = {'com.xlox.ui.HomeSettingsNavigationTest': 40,
                      'com.xlox.utils.AppManagerObbStateTest': 16}
          for variant in ('testAnoyDebugUnitTest', 'testKennyDebugUnitTest'):
              for name, count in expected.items():
                  actual = suites.get((variant, name))
                  assert actual is not None and actual['tests'] >= count, (variant, name, actual)
          assert totals['tests'] >= 112, 'Both brands must run all 20 UI + 8 OBB tests on Android 21 and 28.'
          assert totals['failures'] == totals['errors'] == totals['skipped'] == 0, summary
          print('::notice title=Android host test totals::' + summary)
          PYNAV
          nav_rc=$?
          if [ "$rc" -eq 0 ]; then rc=$nav_rc; fi
          if [ "$rc" -ne 0 ]; then
            python3 - <<'PYNAVLOG'
          from pathlib import Path
          log = '\n'.join(Path('/tmp/navigation-tests.log').read_text(errors='replace').splitlines()[-100:])
          print('::error title=Android navigation Gradle failure::' + log[-6500:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYNAVLOG
          fi
          exit "$rc"

      - name: Build BOTH release variants
        env:
          XLOX_STORE_PASSWORD: ${{ secrets.XLOX_STORE_PASSWORD }}
          XLOX_KEY_PASSWORD: ${{ secrets.XLOX_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleAnoyRelease :app:assembleKennyRelease --no-daemon > /tmp/assemble.log 2>&1
          rc=$?
          cat /tmp/assemble.log
          if [ "$rc" -ne 0 ]; then
            python3 - <<'PYLOG'
          from pathlib import Path
          log = '\n'.join(Path('/tmp/assemble.log').read_text(errors='replace').splitlines()[-80:])
          print('::error title=Android assembly failed::' + log[-7000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYLOG
          fi
          exit "$rc"

      - name: Lint both variants
        run: |
          set +e
          ./gradlew :app:lintAnoyRelease :app:lintKennyRelease --no-daemon > /tmp/lint.log 2>&1
          rc=$?
          cat /tmp/lint.log
          if [ "$rc" -ne 0 ]; then
            python3 - <<'PYLINT'
          from pathlib import Path
          reports = sorted(Path('app/build').rglob('lint-results*.txt'))
          log = '\n'.join(Path('/tmp/lint.log').read_text(errors='replace').splitlines()[-100:])
          messages = []
          for report in reports:
              text = report.read_text(errors='replace')
              errors = [line for line in text.splitlines() if ': Error:' in line]
              if errors:
                  messages.extend(errors)
          from collections import defaultdict
          import re
          by_issue = defaultdict(list)
          for message in messages:
              match = re.search(r'\[([^]\n]+)\]$', message)
              by_issue[match[1] if match else 'Unknown'].append(message)
          for issue, lines in sorted(by_issue.items()):
              detail = str(len(lines)) + ' error(s):\n' + '\n'.join(lines[:5])
              print('::error title=Android lint ' + issue + '::' + detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          print('::error title=Android lint failed::' + log[-6000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYLINT
          fi
          exit "$rc"

      - name: Collect separately named APKs
        run: |
          mkdir -p ../dist
          ANOY=$(find app/build/outputs/apk/anoy/release -name '*.apk' | head -1)
          KENNY=$(find app/build/outputs/apk/kenny/release -name '*.apk' | head -1)
          test -n "$ANOY" && test -n "$KENNY"
          cp "$ANOY" ../dist/Anoy-XLOX-loader.apk
          cp "$KENNY" ../dist/KennyPvt-loader.apk
          (cd ../dist && sha256sum Anoy-XLOX-loader.apk KennyPvt-loader.apk > SHA256SUMS.txt)

      - name: Verify permissions in BOTH APKs
        run: python3 scripts/check_apk_permissions.py ../dist/Anoy-XLOX-loader.apk ../dist/KennyPvt-loader.apk

      - name: Verify compiled package identities and visible branding in BOTH APKs
        run: python3 scripts/check_branding.py ../dist/Anoy-XLOX-loader.apk ../dist/KennyPvt-loader.apk

      - name: Verify merged login callback routing in BOTH APKs
        run: python3 scripts/test_runtime_fixes.py ../dist/Anoy-XLOX-loader.apk ../dist/KennyPvt-loader.apk

      - name: Verify supplied artwork pixels in the compiled Kenny APK
        run: python3 scripts/kenny_icons.py --check --apk ../dist/KennyPvt-loader.apk

      - name: Verify native alignment in BOTH APKs
        run: |
          for APK in ../dist/Anoy-XLOX-loader.apk ../dist/KennyPvt-loader.apk; do
            unzip -p "$APK" lib/arm64-v8a/libXloX.so > /tmp/libXloX.so
            if ! python3 scripts/check_elf_alignment.py --fail-on-unaligned /tmp/libXloX.so; then
              echo "::error title=Native alignment::$APK libXloX.so is not 16 KiB aligned. See the preceding alignment report."
              exit 1
            fi
          done

      - name: Verify both release signatures
        if: env.XLOX_SIGNED == 'true'
        env:
          XLOX_STORE_PASSWORD: ${{ secrets.XLOX_STORE_PASSWORD }}
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          SIGNER_JAR="$(dirname "$APKSIGNER")/lib/apksigner.jar"
          test -f "$SIGNER_JAR"
          export SIGNER_JAR
          # Export only the public certificate; the original private key stays in its keystore.
          keytool -exportcert -keystore app/xlox.jks -storepass:env XLOX_STORE_PASSWORD -alias key0 > /tmp/original-signer.der
          mkdir -p /tmp/original-signer-check
          javac -source 8 -target 8 -cp "$SIGNER_JAR" -d /tmp/original-signer-check tests/apk/VerifyOriginalSigner.java
          python3 - <<'PYSIGN'
          import os, subprocess
          from pathlib import Path
          apks = [Path('../dist/Anoy-XLOX-loader.apk'), Path('../dist/KennyPvt-loader.apk')]
          apks += sorted(Path('../prior-release-backup').glob('*.apk'))
          # ApkVerifier returns actual verified certificates. Human-readable apksigner
          # report labels vary by SDK tools version and are not a machine-readable API.
          result = subprocess.run(['java', '-cp', os.environ['SIGNER_JAR'] + ':/tmp/original-signer-check',
                                   'com.xlox.tests.apk.VerifyOriginalSigner', '/tmp/original-signer.der',
                                   *map(str, apks)], capture_output=True, text=True)
          print(result.stdout)
          if result.returncode:
              detail = result.stderr[-5000:]
              print('::error title=Original signer gate failed::' + detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
              raise SystemExit(result.returncode)
          PYSIGN

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.XLOX_SIGNED == 'true' && 'Anoy-APK' || 'Anoy-APK-unsigned' }}
          path: dist/Anoy-XLOX-loader.apk
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.XLOX_SIGNED == 'true' && 'KennyPvt-APK' || 'KennyPvt-APK-unsigned' }}
          path: dist/KennyPvt-loader.apk
          retention-days: 14
          if-no-files-found: error
      - name: Upload Android navigation test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Android-navigation-tests
          path: |
            xlox/app/build/reports/tests/
            xlox/app/build/test-results/
            /tmp/navigation-tests.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Android-lint-reports
          path: xlox/app/build/reports/lint-results-*
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish both APKs in ONE GitHub release (no pruning)
        if: env.XLOX_SIGNED == 'true' && ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[verify-2.4.3]')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release))
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          printf '%s\n' \
            "Anoy + KennyPvt $APP_VERSION_NAME ($APP_VERSION_CODE)" '' \
            '- Anoy: com.xlox (existing package and signing key preserved)' \
            '- KennyPvt: com.kennypvt (separate app, library and APK-update channel)' \
            '- One shared panel and licence database; each Owner publishes only their own releases.' \
            '- BGMI keeps libbgmi.so; BGMI Air / Lite (com.krafton.bgmilite) uses its own libbgmilite.so and supplied icon.' \
            '- Air stays Coming soon until its own library is installed from the Owner bundle.' \
            '- Independent Launch / Stop; a second game requires a ten-second warning and explicit confirmation.' \
            '- Clean game cards contain their own controls, readiness/OBB state, feedback and progress; no pinned game-action bar.' \
            '- Smaller Welcome back, compact top-right expiry/status, dark-blue announcement and refined Settings with static Android-21-compatible Manrope fonts.' \
            '- Blue Home / Settings capsule supports taps and real horizontal/diagonal swipes over scrollable content and buttons; Help stays in Settings, with centered red Sign out.' \
            '- Swipe, button cancellation, font loading and read-only OBB regressions pass on host Android 21/28 for both brands; physical-device UI/game validation is still required.' \
            '- Real-device Air launch, assets and provider compatibility remain unverified; no game library is bundled in these APKs.' \
            '- These downloads do not automatically change either live panel release.' \
            "- Source commit: ${{ github.sha }}" '' > /tmp/release-notes.md
          cat dist/SHA256SUMS.txt >> /tmp/release-notes.md
          if [ "$APP_VERSION_NAME" = 2.4.3 ] && [ "$APP_VERSION_CODE" = 21 ]; then
            printf '\n%s\n' \
              'Owner-requested replacement 2.4.3 (21). Installed code-20 builds can update; installed code-21 builds do not see an equal-code OTA upgrade and need a manual same-signer APK update. Do not uninstall or clear app/container data.' >> /tmp/release-notes.md
          fi
          PRE_RELEASE=false
          case "$APP_VERSION_NAME" in
            *-webtest*|*-test*|*-rc*) PRE_RELEASE=true ;;
          esac
          if [ "$PRE_RELEASE" = true ]; then
            printf '\n%s\n' \
              '**Phone validation pending — this is a non-latest prerelease, not a confirmed runtime fix.**' \
              'The web-login candidate uses the original Mundo AAR and keeps game web-login navigation inside the loader. Provider authentication still needs a real-device test. It does not change live panel selections.' \
              'This candidate deliberately retains versionCode 21 for an in-place return to 2.4.3 without uninstalling or clearing container data.' >> /tmp/release-notes.md
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            TARGET=$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)
            [ "$TARGET" = '${{ github.sha }}' ] || { echo '::error::This version belongs to a different commit. Bump versionCode; the existing release is untouched.'; exit 1; }
            gh release upload "$RELEASE_TAG" dist/Anoy-XLOX-loader.apk dist/KennyPvt-loader.apk dist/SHA256SUMS.txt --clobber
          else
            if [ "$PRE_RELEASE" = true ]; then
              gh release create "$RELEASE_TAG" dist/Anoy-XLOX-loader.apk dist/KennyPvt-loader.apk dist/SHA256SUMS.txt \
                --target '${{ github.sha }}' --title "Anoy + KennyPvt $APP_VERSION_NAME ($APP_VERSION_CODE)" --notes-file /tmp/release-notes.md --prerelease --latest=false
            else
              gh release create "$RELEASE_TAG" dist/Anoy-XLOX-loader.apk dist/KennyPvt-loader.apk dist/SHA256SUMS.txt \
                --target '${{ github.sha }}' --title "Anoy + KennyPvt $APP_VERSION_NAME ($APP_VERSION_CODE)" --notes-file /tmp/release-notes.md --latest
            fi
          fi
          # Deliberately no release deletion, tag cleanup or /lib publication.
