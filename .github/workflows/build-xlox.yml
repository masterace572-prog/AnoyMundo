name: Build XLOX loader APK

# Builds the Anoy-integrated XLOX loader on GitHub-hosted runners (the sandbox
# has no Android SDK). Produces a signed release APK + a starter loader ZIP.
# Signing needs the XLOX_STORE_PASSWORD / XLOX_KEY_PASSWORD repository
# secrets; without them the APK is built and checked but not published.
#
# 2.3.2: this is the only workflow that runs on an app push. It also runs the
# static UI gates and the permissions-in-APK check (moved from the emulator
# QA, which is now manual). The release is tagged anoy-v<versionName>-<versionCode>
# (read from app/build.gradle), marked Latest, and every other release + tag
# is deleted afterwards, so exactly one release remains.
on:
  workflow_dispatch:
    inputs:
      publish_loader_zip:
        description: 'Publish the starter loader ZIP to the live panel (/lib)'
        type: boolean
        default: false
      panel_version:
        description: 'Version string to publish (only used when publishing)'
        type: string
        default: '1.0.0'
  # Ordinary pushes build and attach the APK; they never touch the live panel.
  push:
    branches: [arena/2e95185a-anoymundo]
    paths:
      - 'xlox/**'
      - '.github/workflows/build-xlox.yml'

permissions:
  contents: write

concurrency:
  group: build-xlox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        working-directory: xlox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bundle the BGMI icon (downloaded once, then committed)
        run: python3 scripts/fetch_game_icon.py

      - name: Static UI gates (no SDK needed)
        run: python3 scripts/ui_quality_gate.py

      - name: Read the version from app/build.gradle
        run: |
          NAME=$(sed -nE "s/^[[:space:]]*versionName[[:space:]]+'([^']+)'.*/\1/p" app/build.gradle | head -1)
          CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' app/build.gradle | head -1)
          [ -n "$NAME" ] && [ -n "$CODE" ] || { echo "::error::Could not read versionName / versionCode from app/build.gradle"; exit 1; }
          echo "APP_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=anoy-v$NAME-$CODE" >> "$GITHUB_ENV"
          echo "App $NAME ($CODE) -> release anoy-v$NAME-$CODE"

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            xlox/gradle/wrapper/gradle-wrapper.properties
            xlox/build.gradle
            xlox/app/build.gradle

      # ubuntu-24.04 images already ship an Android SDK. Avoid the third-party
      # setup action (it breaks on the new runner images); install cmdline-tools
      # ourselves only when neither ANDROID_HOME nor sdkmanager is available.
      - name: Install SDK platform, build-tools and pinned NDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          mkdir -p "$SDK"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SM="$(command -v sdkmanager)"
          else
            echo "Installing Android command line tools"
            curl -fsSL -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf /tmp/cmdtools && mkdir -p /tmp/cmdtools
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mkdir -p "$SDK/cmdline-tools/latest"
            cp -r /tmp/cmdtools/cmdline-tools/. "$SDK/cmdline-tools/latest/"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SM" --sdk_root="$SDK" --install "platform-tools" "platforms;android-34" "platforms;android-36" \
                                           "build-tools;34.0.0" "ndk;24.0.8215888"
          test -x "$SDK/ndk/24.0.8215888/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          "$SM" --sdk_root="$SDK" --list_installed | grep -E 'android-36|34\.0\.0|24\.0\.8215888'

      # Release signing: the passwords come only from the repository secrets
      # XLOX_STORE_PASSWORD and XLOX_KEY_PASSWORD (never from a tracked file).
      # The key in app/xlox.jks is never regenerated - a different key would
      # stop installed copies from updating. Without the secrets the build is
      # still compiled and linted, but nothing is published.
      - name: Check the release signing secrets
        env:
          XLOX_STORE_PASSWORD: ${{ secrets.XLOX_STORE_PASSWORD }}
        run: |
          if [ -z "$XLOX_STORE_PASSWORD" ]; then
            echo "::warning title=Release APK not signed::Add the XLOX_STORE_PASSWORD and XLOX_KEY_PASSWORD repository secrets (Settings > Secrets and variables > Actions). This build is checked but not published."
            echo "XLOX_SIGNED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          keytool -list -keystore app/xlox.jks -storepass:env XLOX_STORE_PASSWORD -alias key0 >/dev/null 2>&1 || {
            echo "::error::app/xlox.jks does not open with the XLOX_STORE_PASSWORD secret. Check the secret; the key is never regenerated."
            exit 1
          }
          echo "Release keystore opens with the repository secret"
          echo "XLOX_SIGNED=true" >> "$GITHUB_ENV"

      - name: Assemble release APK
        env:
          XLOX_STORE_PASSWORD: ${{ secrets.XLOX_STORE_PASSWORD }}
          XLOX_KEY_PASSWORD: ${{ secrets.XLOX_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon -x lintVitalRelease > /tmp/assemble.log 2>&1
          rc=$?
          cat /tmp/assemble.log
          if [ $rc -ne 0 ]; then
            # Surface compiler / resource errors as annotations (readable via the API).
            grep -E "Duplicate class|error:|: error|e: |ERROR:|What went wrong|AAPT|Execution failed|not found|cannot find symbol" /tmp/assemble.log \
              | grep -v "^\s*at " | head -40 | while IFS= read -r line; do
                echo "::error::$(echo "$line" | cut -c1-400)"
              done
            grep -A3 -E "error:" /tmp/assemble.log | head -60 | tr '\n' ' ' | cut -c1-3500 | sed 's/^/::error title=context::/'
          fi
          exit $rc

      - name: Android lint (errors fail the build)
        run: |
          set +e
          ./gradlew lintRelease --no-daemon > /tmp/lint.log 2>&1
          rc=$?
          cat /tmp/lint.log
          R=$(ls app/build/reports/lint-results-release.txt app/build/intermediates/lint_intermediate_text_report/release/*.txt 2>/dev/null | head -1)
          if [ -n "$R" ]; then
            grep -E ": Error:" "$R" | head -40 | while IFS= read -r line; do echo "::error::$(echo "$line" | cut -c1-400)"; done
            grep -E ": Warning:" "$R" | head -20 | while IFS= read -r line; do echo "::warning::$(echo "$line" | cut -c1-400)"; done
          fi
          [ $rc -ne 0 ] && grep -E "What went wrong|Lint found" /tmp/lint.log | head -5 | sed 's/^/::error::/'
          exit $rc

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: xlox/app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 7

      - name: Build starter loader ZIP (arm64-v8a libbgmi.so)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          CLANG="$SDK/ndk/24.0.8215888/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          test -x "$CLANG" || { echo "NDK clang not found at $CLANG"; exit 1; }
          # 16 KB ELF alignment is mandatory for Android 15+ devices that boot
          # with 16 KB memory pages; a 4 KB-aligned stub would fail dlopen().
          "$CLANG" -shared -fPIC -O2 \
            -Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384 \
            -o libbgmi.so loader-stub/bgmi_stub.c -llog
          head -c 4 libbgmi.so | od -An -tx1
          zip -j xlox-loader.zip libbgmi.so
          unzip -l xlox-loader.zip

      - name: Collect deliverables
        run: |
          mkdir -p ../dist
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK" || { echo "No APK produced"; exit 1; }
          cp "$APK" ../dist/Anoy-XLOX-loader.apk
          cp xlox-loader.zip ../dist/xlox-loader.zip
          ls -lh ../dist
          echo "APK_SHA256=$(sha256sum ../dist/Anoy-XLOX-loader.apk | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Permissions in the built APK
        run: PERMISSIONS_LOG_DIR=/tmp/permissions python3 scripts/check_apk_permissions.py ../dist/Anoy-XLOX-loader.apk

      - name: Assert the APK really contains the native panel library
        run: |
          unzip -l ../dist/Anoy-XLOX-loader.apk | grep -F 'libXloX.so' || {
            echo "libXloX.so is missing from the APK"; exit 1; }
          unzip -l ../dist/Anoy-XLOX-loader.apk | grep -E 'META-INF/.*\.(RSA|SF)' \
            || echo "v2/v3 signature only (no v1 jar signature, still valid)"
          test -f ../dist/xlox-loader.zip
          echo "APK sha256 = $APK_SHA256"

      - name: Verify the release signature
        if: env.XLOX_SIGNED == 'true'
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner | sort | tail -1)
          "$APKSIGNER" verify ../dist/Anoy-XLOX-loader.apk
          echo "Release APK is signed with the release key"

      - name: Verify 16 KB ELF alignment (Android 15 / 17 devices)
        run: |
          # Report every native library. The two prebuilt libs inside
          # mundo-release.aar ship 4 KB-aligned and cannot be relinked here,
          # so they are reported but do not fail the build (see README).
          python3 scripts/check_elf_alignment.py \
            ../dist/Anoy-XLOX-loader.apk ../dist/xlox-loader.zip || true
          # Hard requirement: everything we build ourselves must be 16 KB.
          unzip -p ../dist/Anoy-XLOX-loader.apk lib/arm64-v8a/libXloX.so > /tmp/libXloX.so
          python3 scripts/check_elf_alignment.py --fail-on-unaligned \
            /tmp/libXloX.so ../dist/xlox-loader.zip

      - name: Upload APK and loader ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.XLOX_SIGNED == 'true' && 'xlox-apk' || 'xlox-apk-unsigned' }}
          path: |
            dist/Anoy-XLOX-loader.apk
            dist/xlox-loader.zip
          retention-days: 7
          if-no-files-found: error

      # The APK is published as a GitHub release (durable download link); build
      # outputs are never committed to the repository.
      - name: Publish APK as a GitHub release (anoy-v<name>-<code>, Latest)
        if: env.XLOX_SIGNED == 'true'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TITLE="Anoy $APP_VERSION_NAME ($APP_VERSION_CODE)"
          printf '%s\n' \
            "Anoy $APP_VERSION_NAME" "" \
            "- versionName: $APP_VERSION_NAME" \
            "- versionCode: $APP_VERSION_CODE" \
            "- commit: ${{ github.sha }}" \
            "- APK sha256: $APK_SHA256" "" \
            "Panel APK link: https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/Anoy-XLOX-loader.apk" \
            > /tmp/release-notes.md
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # Same version rebuilt: replace the files, keep the tag.
            gh release upload "$RELEASE_TAG" dist/Anoy-XLOX-loader.apk dist/xlox-loader.zip --clobber
            gh release edit "$RELEASE_TAG" --title "$TITLE" --notes-file /tmp/release-notes.md --latest
            echo "::notice title=Release updated::$RELEASE_TAG files replaced (sha256 $APK_SHA256)"
          else
            gh release create "$RELEASE_TAG" dist/Anoy-XLOX-loader.apk dist/xlox-loader.zip \
              --target "${{ github.sha }}" --title "$TITLE" --notes-file /tmp/release-notes.md --latest
            echo "::notice title=Release created::$RELEASE_TAG (sha256 $APK_SHA256)"
          fi
          echo "RELEASE_PUBLISHED=true" >> "$GITHUB_ENV"

      # Exactly one release stays: the one just published. Never touches $RELEASE_TAG.
      - name: Delete every other release and tag
        if: env.RELEASE_PUBLISHED == 'true'
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          REPO="${{ github.repository }}"
          gh release view "$RELEASE_TAG" >/dev/null || { echo "::error::$RELEASE_TAG is missing; nothing deleted"; exit 1; }
          deleted=0; failed=0
          for t in $(gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[].tag_name'); do
            [ "$t" = "$RELEASE_TAG" ] && continue
            if gh release delete "$t" --yes --cleanup-tag; then deleted=$((deleted+1)); else failed=$((failed+1)); fi
          done
          tags=0
          for t in $(gh api --paginate "repos/$REPO/git/matching-refs/tags/" --jq '.[].ref | sub("^refs/tags/"; "")'); do
            [ "$t" = "$RELEASE_TAG" ] && continue
            if gh api -X DELETE "repos/$REPO/git/refs/tags/$t" --silent; then tags=$((tags+1)); else failed=$((failed+1)); fi
          done
          left=$(gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[].tag_name' | tr '\n' ' ')
          echo "::notice title=Releases cleaned::deleted $deleted releases and $tags leftover tags; remaining: $left"
          [ "$failed" -eq 0 ] || echo "::warning::$failed releases/tags could not be deleted"

      - name: Check the panel lib + version endpoints
        run: |
          BASE="https://anoymundo-panel.vercel.app"
          printf 'version endpoint: '; curl -sS --max-time 30 "$BASE/api/lib/version" | tr -d '\n'; echo
          curl -sS --max-time 30 -o /tmp/panel-lib.bin \
            -w 'download endpoint: HTTP %{http_code}, %{content_type}, %{size_download} bytes\n' \
            "$BASE/api/lib/download" || true

      - name: Publish starter loader ZIP to the panel
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_loader_zip }}
        env:
          PANEL_BASE_URL: https://anoymundo-panel.vercel.app
          PANEL_ADMIN_USERNAME: Anoy
          PANEL_ADMIN_PASSWORD: ${{ secrets.PANEL_OWNER_PASSWORD }}
        run: |
          node scripts/publish-release.mjs ../dist/xlox-loader.zip \
            "${{ inputs.panel_version }}"

      - name: Done
        run: echo "XLOX APK built from ${{ github.sha }}"
