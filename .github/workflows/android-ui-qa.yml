name: Android UI QA

# Verification for the UI redesign (AUDIT.md §14): compile the debug variant,
# run Android Lint, enforce the resource/literal quality gates, then install
# the APK on an emulator and capture light/dark + font-scale screenshots.
on:
  workflow_dispatch:
  push:
    branches: [arena/b2fac70f-anoymundo]
    paths:
      - 'xlox/**'
      - '.github/workflows/android-ui-qa.yml'
      - 'docs/ui-redesign/**'

permissions:
  contents: write

concurrency:
  group: android-ui-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: xlox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            xlox/gradle/wrapper/gradle-wrapper.properties
            xlox/build.gradle
            xlox/app/build.gradle

      - name: Install Android SDK, NDK and emulator image
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          mkdir -p "$SDK"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SM="$(command -v sdkmanager)"
          else
            curl -fsSL -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf /tmp/cmdtools && mkdir -p /tmp/cmdtools
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mkdir -p "$SDK/cmdline-tools/latest"
            cp -r /tmp/cmdtools/cmdline-tools/. "$SDK/cmdline-tools/latest/"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SM" --sdk_root="$SDK" --install \
            "platform-tools" "platforms;android-34" "platforms;android-36" \
            "build-tools;34.0.0" "ndk;24.0.8215888" \
            "system-images;android-33;google_apis;x86_64" \
            "emulator"
          "$SM" --sdk_root="$SDK" --list_installed | grep -E 'android-33|34\.0\.0|24\.0\.8215888'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/assembleDebug.log
          ls -lh app/build/outputs/apk/debug/

      - name: Android Lint (debug)
        run: |
          ./gradlew :app:lintDebug --no-daemon --stacktrace 2>&1 | tee /tmp/lintDebug.log
          rc=${PIPESTATUS[0]}
          echo "=== FULL LINT TEXT REPORT ===" >> /tmp/lintDebug.log
          cat app/build/intermediates/lint_intermediate_text_report/debug/lint-results-debug.txt >> /tmp/lintDebug.log 2>/dev/null || true
          python3 - <<'PY'
          import pathlib, re, sys
          p = pathlib.Path('app/build/intermediates/lint_intermediate_text_report/debug/lint-results-debug.txt')
          text = p.read_text(errors='replace') if p.exists() else ''
          found = re.findall(r'(\d+) errors?, (\d+) warnings?', text)
          print('lint summary:', found[-1] if found else 'missing')
          if not found or any(int(v) for v in found[-1]):
              sys.exit('::error::lint reported errors or warnings')
          PY
          exit $rc

      - name: Resource and literal quality gates
        run: python3 scripts/ui_quality_gate.py

      - name: Upload lint and gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-lint-report
          path: |
            xlox/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14

      - name: Prime emulator diagnostics
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p qa-logs
          echo "PRE-EMULATOR: workflow reached the emulator step at $(date -u +%H:%M:%S)" > qa-logs/emulator.log

      - name: Emulator screenshots (light / dark / font scale / small width)
        working-directory: xlox
        run: |
          set -eu
          mkdir -p ../qa-logs
          exec > ../qa-logs/emulator-boot.log 2>&1
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export PATH="$SDK/platform-tools:$SDK/emulator:$SDK/cmdline-tools/latest/bin:$PATH"
          AVD=ui_qa_avd
          echo "=== manual emulator QA at $(date -u) ==="
          echo "SDK=$SDK"
          if [ -e /dev/kvm ]; then
            echo "=== /dev/kvm before ==="; ls -l /dev/kvm || true
            sudo chmod 666 /dev/kvm 2>/dev/null || true
            echo "=== /dev/kvm after ==="; ls -l /dev/kvm || true
          else
            echo "/dev/kvm is absent"
          fi
          if [ -w /dev/kvm ]; then echo "KVM=yes"; else echo "KVM=no (software acceleration)"; fi
          adb start-server || true
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          echo "no" | avdmanager create avd --force -n "$AVD" \
            -k 'system-images;android-33;google_apis;x86_64' \
            -p "$ANDROID_AVD_HOME/$AVD.avd" \
            --device 'pixel_5' || echo "WARN: avdmanager create returned nonzero"
          echo "=== AVD directory ==="
          ls -la "$ANDROID_AVD_HOME" || true
          echo "=== emulator -list-avds ==="
          emulator -list-avds || true

          OPTS="-port 5554 -avd $AVD -no-snapshot-save -no-snapstorage -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect"
          if [ ! -w /dev/kvm ]; then OPTS="$OPTS -accel off"; fi
          echo "launching: emulator $OPTS"
          nohup emulator $OPTS > ../qa-logs/emulator-stdout.log 2>&1 &
          EMU_PID=$!
          echo "emulator pid=$EMU_PID"

          booted=0
          for i in $(seq 1 240); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "FATAL: emulator process exited before boot"
              break
            fi
            state=$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$state" = "1" ]; then booted=1; break; fi
            sleep 5
          done
          echo "booted=$booted after $((i-1)) checks"
          if [ "$booted" != "1" ]; then
            echo "=== emulator stdout ==="; cat ../qa-logs/emulator-stdout.log 2>/dev/null || true
            echo "=== adb devices ==="; adb devices 2>/dev/null || true
            kill "$EMU_PID" 2>/dev/null || true
            exit 1
          fi

          # Settle the system server, suppress the first-run immersive-mode
          # education overlay and close any boot-time system dialogs.
          sleep 10
          adb -s emulator-5554 shell input keyevent 82 || true
          adb shell settings put secure immersive_mode_confirmations confirmed || true
          adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS || true
          adb shell settings put global window_animation_scale 0.0 || true
          adb shell settings put global transition_animation_scale 0.0 || true
          adb shell settings put global animator_duration_scale 0.0 || true

          sh scripts/ui_screenshots.sh
          kill "$EMU_PID" 2>/dev/null || true
          echo "=== emulator QA complete ==="

      - name: Surface emulator diagnostics
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          echo "=== qa-logs/emulator-boot.log ==="
          cat qa-logs/emulator-boot.log 2>/dev/null || echo "(no emulator boot log)"
          echo "=== qa-logs/emulator-trace.txt ==="
          cat qa-logs/emulator-trace.txt 2>/dev/null || echo "(no emulator trace)"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('qa-logs/emulator-trace.txt')
          lines = p.read_text(errors='replace').splitlines() if p.exists() else ['(no trace file)']
          if not lines:
              lines = ['(trace file was empty)']
          if len(lines) > 30:
              lines = lines[:8] + ['...'] + lines[-22:]
          for line in lines:
              safe = (line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))[:280]
              print('::warning::' + safe)
          PY

      - name: Validate screenshots
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          python3 - <<'PY'
          import hashlib, struct, sys, zlib
          from pathlib import Path

          def first_row(path):
              """Decode only the first PNG scanline using the stdlib."""
              data = path.read_bytes()
              pos, idat, w, ctype = 8, b'', 0, 0
              while pos < len(data):
                  ln = struct.unpack('>I', data[pos:pos + 4])[0]
                  typ = data[pos + 4:pos + 8]
                  chunk = data[pos + 8:pos + 8 + ln]
                  pos += 12 + ln
                  if typ == b'IHDR':
                      w, _h, _depth, ctype = struct.unpack('>IIBB', chunk[:10])
                  elif typ == b'IDAT':
                      idat += chunk
                  elif typ == b'IEND':
                      break
              bpp = {0: 1, 2: 3, 3: 1, 4: 2, 6: 4}.get(ctype, 3)
              raw = zlib.decompress(idat)
              stride = w * bpp
              filt = raw[0]
              line = bytearray(raw[1:1 + stride])
              if filt in (1, 3, 4):
                  for x in range(bpp, stride):
                      line[x] = (line[x] + line[x - bpp]) & 255
              px = line[(w // 2) * bpp:(w // 2) * bpp + 3]
              return sum(px) / 3

          def rows(path, count):
              """Decode the first PNG scanlines with the stdlib (all filters)."""
              data = path.read_bytes()
              pos, idat, w, h, ctype = 8, b'', 0, 0, 0
              while pos < len(data):
                  ln = struct.unpack('>I', data[pos:pos + 4])[0]
                  typ = data[pos + 4:pos + 8]
                  chunk = data[pos + 8:pos + 8 + ln]
                  pos += 12 + ln
                  if typ == b'IHDR':
                      w, h, _depth, ctype = struct.unpack('>IIBB', chunk[:10])
                  elif typ == b'IDAT':
                      idat += chunk
                  elif typ == b'IEND':
                      break
              bpp = {0: 1, 2: 3, 3: 1, 4: 2, 6: 4}.get(ctype, 3)
              raw = zlib.decompress(idat)
              stride = w * bpp
              prev, off, out = bytearray(stride), 0, []
              for _y in range(min(count, h)):
                  filt = raw[off]
                  off += 1
                  line = bytearray(raw[off:off + stride])
                  off += stride
                  for x in range(stride):
                      a = line[x - bpp] if x >= bpp else 0
                      b = prev[x]
                      c = prev[x - bpp] if x >= bpp else 0
                      if filt == 1:
                          line[x] = (line[x] + a) & 255
                      elif filt == 2:
                          line[x] = (line[x] + b) & 255
                      elif filt == 3:
                          line[x] = (line[x] + ((a + b) // 2)) & 255
                      elif filt == 4:
                          pp = a + b - c
                          pa, pb, pc = abs(pp - a), abs(pp - b), abs(pp - c)
                          pr = a if pa <= pb and pa <= pc else (b if pb <= pc else c)
                          line[x] = (line[x] + pr) & 255
                  out.append(line)
                  prev = line
              return w, bpp, out

          def icon_pixels(path, dark_icons):
              """Count legible status-bar icon pixels in the top 80 rows."""
              w, bpp, lines = rows(path, 80)
              total = 0
              for line in lines:
                  for x in range(w):
                      px = line[x * bpp:x * bpp + 3]
                      lum = sum(px) / 3
                      if (dark_icons and lum < 120) or (not dark_icons and lum > 180):
                          total += 1
              return total

          files = sorted(Path('docs/ui-redesign/screenshots').glob('*.png'))
          print('screenshot count:', len(files))
          expected = {
              'login_light.png', 'login_dark.png', 'main_light.png', 'main_dark.png',
              'facebook_light.png', 'facebook_dark.png',
              'components_light.png', 'components_dark.png',
              'login_font_130.png', 'main_font_130.png',
              'login_320.png', 'main_320.png',
          }
          missing = sorted(expected - {f.name for f in files})
          if missing:
              print('::error::missing required screenshots:', missing)
              sys.exit(1)
          if len(files) < 12:
              print('::error::expected 12 screenshots, found', len(files))
              sys.exit(1)
          small = [(f.name, f.stat().st_size) for f in files if f.stat().st_size < 5000]
          if small:
              print('::error::blank or truncated screenshots:', small)
              sys.exit(1)
          seen, dups = {}, []
          for f in files:
              h = hashlib.md5(f.read_bytes()).hexdigest()
              if h in seen:
                  dups.append((seen[h], f.name))
              seen[h] = f.name
          print('duplicate frames:', dups)
          if dups:
              print('::error::duplicate frames: ' + str(dups))
              sys.exit(1)
          light = Path('docs/ui-redesign/screenshots/login_light.png')
          dark = Path('docs/ui-redesign/screenshots/login_dark.png')
          ll, dd = first_row(light), first_row(dark)
          print('top-row luminance: light=%.1f dark=%.1f' % (ll, dd))
          if abs(ll - dd) < 60:
              print('::error::light and dark screenshots are not visually distinct')
              sys.exit(1)

          # System-bar icon contrast: light palettes need dark icons, dark
          # palettes need light icons. Catches a splash theme leaking white
          # icons onto a cream status bar.
          bar_bad = []
          for f in files:
              if '320' in f.name:
                  continue  # 320x640 frames have a shorter status bar
              want_dark = not f.name.endswith('_dark.png')
              n = icon_pixels(f, want_dark)
              if n < 200:
                  bar_bad.append((f.name, n))
          print('status-bar icon pixel counts:', [(f.name, icon_pixels(f, not f.name.endswith('_dark.png'))) for f in files if '320' not in f.name])
          if bar_bad:
              print('::error::status bar icons lack contrast:', bar_bad)
              sys.exit(1)

          # Every capture must actually show the app (not the launcher or a
          # crash-to-home screen), and no com.xlox crash may be in logcat.
          trace_path = Path('qa-logs/emulator-trace.txt')
          trace = trace_path.read_text(errors='replace') if trace_path.exists() else ''
          focus = [l for l in trace.splitlines() if l.startswith('focus for ')]
          bad_focus = [l for l in focus if 'com.xlox' not in l]
          print('focus lines:', len(focus))
          if len(focus) < 12 or bad_focus:
              print('::error::app was not foreground for every capture:', bad_focus[:4])
              sys.exit(1)
          lc = Path('qa-logs/logcat.txt')
          lc_text = lc.read_text(errors='replace') if lc.exists() else ''
          if 'FATAL EXCEPTION' in lc_text and 'Process: com.xlox' in lc_text:
              print('::error::com.xlox crashed while capturing screenshots')
              sys.exit(1)
          print('::notice::screenshot validation passed')
          PY

      - name: Commit screenshots to the branch
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/ui-redesign/screenshots/ qa-logs/
          if git diff --cached --quiet; then
            echo "No screenshot changes"
          else
            git commit -m "Add UI QA screenshots [skip ci]" -q
            echo "Screenshot commit created"
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: docs/ui-redesign/screenshots/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Publish QA artifacts to the branch
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          set -u
          mkdir -p qa-logs
          cp /tmp/assembleDebug.log qa-logs/assembleDebug.log 2>/dev/null || true
          cp /tmp/lintDebug.log qa-logs/lintDebug.log 2>/dev/null || true
          cp xlox/app/build/intermediates/lint_intermediate_text_report/debug/lint-results-debug.txt qa-logs/lint-results-debug.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f qa-logs/ docs/ui-redesign/screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "QA logs for run ${{ github.run_number }} [skip ci]" -q
          fi
          pushed=0
          for attempt in $(seq 1 15); do
            if git push origin HEAD:arena/b2fac70f-anoymundo; then pushed=1; break; fi
            echo "publish attempt $attempt: syncing with remote"
            git fetch origin arena/b2fac70f-anoymundo -q || true
            git merge --abort 2>/dev/null || true
            git merge --no-edit FETCH_HEAD -q || echo "WARN: merge failed, will retry"
            sleep 4
          done
          [ "$pushed" = 1 ] || { echo "FATAL: could not publish QA artifacts"; exit 1; }
