name: Android UI QA

# Verification for the UI redesign (AUDIT.md §14): compile the debug variant,
# run Android Lint, enforce the resource/literal quality gates, then install
# the APK on an emulator and capture light/dark + font-scale screenshots.
on:
  workflow_dispatch:
  push:
    branches: [arena/b2fac70f-anoymundo]
    paths:
      - 'xlox/**'
      - '.github/workflows/android-ui-qa.yml'
      - 'docs/ui-redesign/**'

permissions:
  contents: write

concurrency:
  group: android-ui-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: xlox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            xlox/gradle/wrapper/gradle-wrapper.properties
            xlox/build.gradle
            xlox/app/build.gradle

      - name: Install Android SDK, NDK and emulator image
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          mkdir -p "$SDK"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SM="$(command -v sdkmanager)"
          else
            curl -fsSL -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf /tmp/cmdtools && mkdir -p /tmp/cmdtools
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mkdir -p "$SDK/cmdline-tools/latest"
            cp -r /tmp/cmdtools/cmdline-tools/. "$SDK/cmdline-tools/latest/"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SM" --sdk_root="$SDK" --install \
            "platform-tools" "platforms;android-34" "platforms;android-36" \
            "build-tools;34.0.0" "ndk;24.0.8215888" \
            "system-images;android-33;google_apis;x86_64" \
            "emulator"
          "$SM" --sdk_root="$SDK" --list_installed | grep -E 'android-33|34\.0\.0|24\.0\.8215888'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/assembleDebug.log
          ls -lh app/build/outputs/apk/debug/

      - name: Android Lint (debug)
        run: |
          ./gradlew :app:lintDebug --no-daemon --stacktrace 2>&1 | tee /tmp/lintDebug.log
          rc=${PIPESTATUS[0]}
          echo "=== FULL LINT TEXT REPORT ===" >> /tmp/lintDebug.log
          cat app/build/intermediates/lint_intermediate_text_report/debug/lint-results-debug.txt >> /tmp/lintDebug.log 2>/dev/null || true
          exit $rc

      - name: Resource and literal quality gates
        run: python3 scripts/ui_quality_gate.py

      - name: Upload lint and gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-lint-report
          path: |
            xlox/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14

      - name: Prime emulator diagnostics
        run: |
          mkdir -p qa-logs
          echo "PRE-EMULATOR: workflow reached the emulator step at $(date -u +%H:%M:%S)" > qa-logs/emulator.log

      - name: Emulator screenshots (light / dark / font scale / small width)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_5
          avd-name: ui_qa_avd
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -noaudio -no-boot-anim
          working-directory: xlox
          script: |
            # POSIX sh (dash): no pipefail. Keep stdout flowing to the job log
            # AND mirror every milestone into a trace file inside the checkout.
            set -u
            mkdir -p ../qa-logs
            LOG=../qa-logs/emulator-trace.txt
            : > "$LOG"
            log() { echo "$*"; echo "$*" >> "$LOG"; }
            fatal() { echo "::error::$*"; log "FATAL: $*"; exit 1; }
            log "=== emulator QA started ==="
            APK=app/build/outputs/apk/debug/app-debug.apk
            OUT=../docs/ui-redesign/screenshots
            mkdir -p "$OUT" || fatal "cannot create $OUT"
            test -f "$APK" || fatal "debug APK missing at $APK"

            adb wait-for-device || log "WARN: adb wait-for-device failed"
            # The loader ships arm64-v8a JNI only. On an x86_64 emulator that
            # usually returns INSTALL_FAILED_NO_MATCHING_ABIS, so fall back to
            # an ABI-neutral, QA-only build of the same APK (native libs
            # removed, resigned). Every JNI call is already guarded.
            adb uninstall com.xlox >/dev/null 2>&1 || true
            if INSTALL_OUT=$(adb install -r -g "$APK" 2>&1); then
              log "direct install ok: $INSTALL_OUT"
            else
              log "WARN: direct install failed: $INSTALL_OUT"
              adb uninstall com.xlox >/dev/null 2>&1 || true
              cp "$APK" /tmp/qa-unsigned.apk
              zip -q -d /tmp/qa-unsigned.apk 'lib/arm64-v8a/*' >/dev/null 2>&1 || true
              keytool -genkeypair -keystore /tmp/qa.keystore -alias qa \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass android -keypass android -dname "CN=Anoy UI QA" >/dev/null 2>&1 \
                || fatal "cannot create QA keystore"
              "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" sign \
                --ks /tmp/qa.keystore --ks-pass pass:android --key-pass pass:android \
                --out /tmp/qa-signed.apk /tmp/qa-unsigned.apk \
                || fatal "cannot resign QA APK"
              if INSTALL_OUT=$(adb install -r -g /tmp/qa-signed.apk 2>&1); then
                log "ABI-neutral install ok: $INSTALL_OUT"
              else
                fatal "ABI-neutral install failed: $INSTALL_OUT"
              fi
            fi
            adb shell appops set com.xlox MANAGE_EXTERNAL_STORAGE allow || true
            adb shell appops set com.xlox REQUEST_INSTALL_PACKAGES allow || true
            adb shell settings put secure show_ime_with_hard_keyboard 0 || true
            adb shell settings put system font_scale 1.0 || true

            capture() {
              name="$1"; component="$2"
              adb shell am force-stop com.xlox >/dev/null 2>&1 || true
              adb shell am start -W -n "com.xlox/$component" >/dev/null 2>&1 \
                || log "WARN: am start failed for $component"
              sleep 4
              adb exec-out screencap -p > "$OUT/$name.png" \
                || fatal "screencap failed for $name"
              test -s "$OUT/$name.png" || fatal "empty screenshot for $name"
              log "captured $name.png ($(wc -c < "$OUT/$name.png") bytes)"
            }

            for mode in light dark; do
              if [ "$mode" = dark ]; then
                adb shell cmd uimode night yes || fatal "cannot enable night mode"
              else
                adb shell cmd uimode night no || fatal "cannot enable day mode"
              fi
              sleep 2
              capture "login_${mode}" ".LogAct"
              capture "main_${mode}" ".MAct"
              capture "facebook_${mode}" ".FacebookActivity"
              capture "components_${mode}" ".ui.designsystem.DsPreviewActivity"
            done

            # Font scale 1.3, then restore 1.0.
            adb shell settings put system font_scale 1.3 || true
            adb shell cmd uimode night no || true
            sleep 2
            capture "login_font_130" ".LogAct"
            capture "main_font_130" ".MAct"
            adb shell settings put system font_scale 1.0 || true

            # Narrow 320dp width to check clipping/overlap.
            adb shell wm size 320x640 || true
            adb shell wm density 160 || true
            sleep 2
            capture "login_320" ".LogAct"
            capture "main_320" ".MAct"
            adb shell wm size reset || true
            adb shell wm density reset || true

            log "=== all captures complete ==="
            ls -lh "$OUT"

      - name: Surface emulator diagnostics
        if: always()
        run: |
          echo "=== qa-logs/emulator-trace.txt ==="
          cat qa-logs/emulator-trace.txt 2>/dev/null || echo "(no emulator trace)"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('qa-logs/emulator-trace.txt')
          lines = p.read_text(errors='replace').splitlines() if p.exists() else ['(no trace file)']
          if not lines:
              lines = ['(trace file was empty)']
          if len(lines) > 30:
              lines = lines[:8] + ['...'] + lines[-22:]
          for line in lines:
              safe = (line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))[:280]
              print('::warning::' + safe)
          PY

      - name: Commit screenshots to the branch
        if: success()
        working-directory: ${{ github.workspace }}
        run: |
          rm -f qa-logs/emulator.log qa-logs/emulator-trace.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/ui-redesign/screenshots/
          git diff --cached --quiet && { echo "No screenshot changes"; exit 0; }
          git commit -m "Add UI QA screenshots [skip ci]" -q
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin arena/b2fac70f-anoymundo -q || true
            git push origin HEAD:arena/b2fac70f-anoymundo && break
            sleep 6
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: docs/ui-redesign/screenshots/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Publish failure logs to the branch
        if: failure()
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p qa-logs
          cp /tmp/assembleDebug.log qa-logs/assembleDebug.log 2>/dev/null || true
          cp /tmp/lintDebug.log qa-logs/lintDebug.log 2>/dev/null || true
          cp xlox/app/build/intermediates/lint_intermediate_text_report/debug/lint-results-debug.txt qa-logs/lint-results-debug.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f qa-logs/
          git diff --cached --quiet && { echo "No new logs"; exit 0; }
          git commit -m "QA failure logs for run ${{ github.run_number }} [skip ci]" -q
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin arena/b2fac70f-anoymundo -q || true
            git push origin HEAD:arena/b2fac70f-anoymundo && break
            sleep 6
          done
