name: Android UI QA

# Builds debug + release, runs Android Lint and the static UI gates, then
# installs the app on an emulator and captures every screen and state of the
# 2.1 redesign (see xlox/scripts/ui_screenshots.sh): live walkthrough, every
# update-gate / sign-in / home state, animations on + off, font 0.85 / 2.0,
# 360 dp, tablet and the minified release build.
on:
  workflow_dispatch:
  push:
    branches: [arena/2e95185a-anoymundo]
    paths:
      - 'xlox/**'
      - '.github/workflows/android-ui-qa.yml'

permissions:
  contents: write

concurrency:
  group: android-ui-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    defaults:
      run:
        working-directory: xlox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static UI gates (no SDK needed)
        run: python3 scripts/ui_quality_gate.py

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            xlox/gradle/wrapper/gradle-wrapper.properties
            xlox/build.gradle
            xlox/app/build.gradle

      - name: Install Android SDK, NDK and emulator image
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          mkdir -p "$SDK"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SM="$(command -v sdkmanager)"
          else
            curl -fsSL -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf /tmp/cmdtools && mkdir -p /tmp/cmdtools
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mkdir -p "$SDK/cmdline-tools/latest"
            cp -r /tmp/cmdtools/cmdline-tools/. "$SDK/cmdline-tools/latest/"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SM" --sdk_root="$SDK" --install \
            "platform-tools" "platforms;android-34" "platforms;android-36" \
            "build-tools;34.0.0" "ndk;24.0.8215888" \
            "system-images;android-33;google_apis;x86_64" "emulator"

      - name: Build debug + release APKs
        run: |
          chmod +x gradlew
          set -o pipefail
          mkdir -p ../qa-logs
          set +e
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon -x lintVitalRelease > ../qa-logs/assemble.log 2>&1
          rc=$?
          cat ../qa-logs/assemble.log
          if [ $rc -ne 0 ]; then
            grep -E "Duplicate class|error:|: error|e: |ERROR:|What went wrong|AAPT|Execution failed|cannot find symbol" ../qa-logs/assemble.log \
              | grep -v "^\s*at " | head -40 | while IFS= read -r line; do echo "::error::$(echo "$line" | cut -c1-400)"; done
          fi
          exit $rc

      - name: Android Lint (errors fail the job)
        run: |
          set -o pipefail
          ./gradlew :app:lintDebug --no-daemon 2>&1 | tee ../qa-logs/lint.log
          cp app/build/reports/lint-results-debug.txt ../qa-logs/ 2>/dev/null || \
            cp app/build/intermediates/lint_intermediate_text_report/debug/lint-results-debug.txt ../qa-logs/ 2>/dev/null || true

      - name: Emulator screenshots
        run: |
          set -eu
          SDK="$ANDROID_SDK_ROOT"
          export PATH="$SDK/platform-tools:$SDK/emulator:$SDK/cmdline-tools/latest/bin:$PATH"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | avdmanager create avd --force -n qa \
            -k 'system-images;android-33;google_apis;x86_64' --device pixel_5
          OPTS="-port 5554 -avd qa -no-snapshot -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect"
          [ -w /dev/kvm ] || OPTS="$OPTS -accel off"
          nohup emulator $OPTS > ../qa-logs/emulator-stdout.log 2>&1 &
          EMU=$!
          booted=0
          for i in $(seq 1 240); do
            kill -0 $EMU 2>/dev/null || { echo "emulator exited"; cat ../qa-logs/emulator-stdout.log; exit 1; }
            [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && { booted=1; break; }
            sleep 5
          done
          [ "$booted" = 1 ] || { echo "emulator did not boot"; exit 1; }
          export ANDROID_SERIAL=emulator-5554
          sleep 10
          adb shell input keyevent 82 || true
          adb shell settings put secure immersive_mode_confirmations confirmed || true
          adb shell settings put global window_animation_scale 0.0 || true
          adb shell settings put global transition_animation_scale 0.0 || true
          adb shell settings put global animator_duration_scale 0.0 || true
          SHOT_DIR=docs/ui-redesign/after sh scripts/ui_screenshots.sh
          kill $EMU 2>/dev/null || true

      - name: Validate screenshots and logs
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          python3 - <<'PY'
          import hashlib, re, sys
          from pathlib import Path
          shots = Path('xlox/docs/ui-redesign/after')
          need = [
              # splash (frames, reduced motion, animations on)
              'splash', 'splash_reduced_welcome', 'splash_t000', 'splash_t025', 'splash_t080',
              'splash_t130', 'splash_t142', 'splash_t155', 'splash_t220', 'anim_splash_t10',
              'splash_live_cold',
              # launcher icon
              'icon_recents', 'icon_drawer_default',
              # launch result handling
              'home_launch_started_return', 'home_launch_polish_throws_return',
              'home_launch_null_running', 'home_launch_failed', 'home_typical',
              # live walkthrough
              'login', 'login_keyboard', 'login_error_empty', 'login_error_malformed', 'login_key_visible',
              'gate_check_failed_live', 'login_offline', 'login_ok_home', 'home_signout_sheet', 'signout_done',
              # sign-in states
              'login_loading', 'login_wrong', 'login_maintenance', 'login_server', 'login_success',
              # update gate states
              'gate_checking', 'gate_required', 'gate_downloading', 'gate_downloading_unknown',
              'gate_installing', 'gate_done', 'gate_check_failed', 'gate_download_failed',
              # home states
              'home', 'home_scrolled', 'home_note_empty', 'home_note_custom', 'home_expired',
              'home_under_day', 'home_loading', 'home_server_warning', 'home_preparing',
              'home_launching', 'home_error', 'home_snackbar',
              # accessibility / sizes
              'login_font085', 'home_font085', 'login_font20', 'home_font20', 'gate_font20',
              'login_360', 'home_360', 'gate_360', 'login_tablet', 'home_tablet', 'gate_tablet',
              'release_login',
          ]
          errors = []
          files = {p.stem: p for p in shots.glob('*.png')}
          for n in need:
              p = files.get(n)
              if not p or p.stat().st_size < (2500 if n.startswith('splash') else 8000):
                  errors.append(f'missing or blank screenshot: {n}')
          seen = {}
          for n, p in files.items():
              h = hashlib.md5(p.read_bytes()).hexdigest()
              if h in seen and not any(k in n + seen[h] for k in ('live', 'anim_', 'icon_', 'splash_reduced', 'splash_t220', 'home_launch_')):
                  errors.append(f'identical frames: {seen[h]} / {n}')
              seen[h] = n
          trace = Path('qa-logs/emulator-trace.txt')
          t = trace.read_text(errors='replace') if trace.exists() else ''
          for line in t.splitlines():
              if line.startswith('focus for ') and 'com.xlox' not in line:
                  # A cold start has no focused window for its first frames;
                  # only another app in front is a failure.
                  if 'mCurrentFocus=null' in line and ('live' in line or 'anim_' in line):
                      continue
                  errors.append('app not in front: ' + line)
          if 'update gate passed' not in t:
              errors.append('the live update gate never let the user through')
          # Launch handling: a started game never shows the launch error.
          for case, should_fail in (('started', False), ('started_polish_throws', False),
                                    ('null_running', False), ('null_dead', True), ('throws', True)):
              m = re.search(r'^launch %s texts: (.*)$' % case, t, re.M)
              if not m:
                  errors.append(f'launch case {case} not captured')
                  continue
              failed = 'launch the game' in m.group(1)
              if failed != should_fail:
                  errors.append(f'launch case {case}: error shown = {failed}, expected {should_fail}')
              if not should_fail and 'text="Stop"' not in m.group(1):
                  errors.append(f'launch case {case}: game not shown as running')
          if not re.search(r'typical phone: device card bottom \d+, launch fade top \d+: clear', t):
              errors.append('DEVICE card is covered by the Launch bar on a 411 x 914 dp phone')
          m = re.search(r'licence card description: content-desc="([^"]*)"', t)
          if not m or not m.group(1).startswith('Licence active,'):
              errors.append('licence card is not read as one sentence: ' + (m.group(1) if m else 'missing'))
          for name in ('logcat.txt', 'logcat-sizes.txt', 'release-logcat.txt'):
              p = Path('qa-logs') / name
              text = p.read_text(errors='replace') if p.exists() else ''
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if 'FATAL EXCEPTION' in line and 'com.xlox' in '\n'.join(lines[i:i + 3]):
                      errors.append(f'{name}: crash\n' + '\n'.join(lines[i:i + 20]))
                      break
          for e in errors:
              print('::error::' + e.splitlines()[0])
              print(e)
          if errors:
              sys.exit(1)
          print('screenshot validation passed:', sorted(files))
          PY

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-qa
          path: |
            xlox/docs/ui-redesign/
            qa-logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit screenshots and logs to the branch
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p xlox/docs/ui-redesign qa-logs
          git add -f qa-logs || true
          git add -f xlox/docs/ui-redesign || true
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -q -m "UI QA screenshots + logs (run ${{ github.run_number }}) [skip ci]"
          for attempt in 1 2 3 4 5 6 7 8; do
            git push origin HEAD:arena/2e95185a-anoymundo && exit 0
            git pull --rebase -q origin arena/2e95185a-anoymundo || { git rebase --abort; git pull --no-rebase --no-edit -q -X ours origin arena/2e95185a-anoymundo || true; }
            sleep 5
          done
          exit 1
