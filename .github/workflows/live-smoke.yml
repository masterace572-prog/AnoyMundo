name: Live deployment smoke test

# Exercises the deployed Vercel panel against the real Supabase project.
# Signed-in checks need the repository secret PANEL_OWNER_PASSWORD (Owner
# account). Without it only the public checks run. Everything the test
# creates is deleted again.
on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Panel URL'
        type: string
        default: 'https://anoymundo-panel.vercel.app'
      username:
        description: 'Owner username used for the signed-in checks'
        type: string
        default: 'Anoy'
      temp_password:
        description: 'Optional password of a TEMPORARY test account (public repo: never enter a real password here)'
        type: string
        default: ''
  push:
    branches: [arena/2e95185a-anoymundo]
    paths: ['.github/workflows/live-smoke.yml', 'web/scripts/live-smoke.mjs']

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: End-to-end checks against the live panel
        working-directory: web
        env:
          BASE: ${{ inputs.base || 'https://anoymundo-panel.vercel.app' }}
          OWNER_USERNAME: ${{ inputs.username || 'Anoy' }}
          OWNER_PASSWORD: ${{ inputs.temp_password || secrets.PANEL_OWNER_PASSWORD }}
        run: |
          if [ -n "$OWNER_PASSWORD" ]; then echo "::add-mask::$OWNER_PASSWORD"; fi
          node scripts/live-smoke.mjs
