name: Live deployment smoke test

# Public checks always run. Authenticated checks use only the private existing
# Owner secret. No passwords or password hashes are accepted as workflow inputs
# or published in commit statuses, logs, issues, or artifacts.
on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Panel URL'
        type: string
        default: 'https://anoymundo-panel.vercel.app'
      username:
        description: 'Owner username used for the signed-in checks'
        type: string
        default: 'Anoy'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: End-to-end checks against the live panel
        working-directory: web
        env:
          BASE: ${{ inputs.base || 'https://anoymundo-panel.vercel.app' }}
          OWNER_USERNAME: ${{ inputs.username || 'Anoy' }}
          OWNER_PASSWORD: ${{ secrets.PANEL_OWNER_PASSWORD }}
        run: |
          if [ -n "$OWNER_PASSWORD" ]; then echo "::add-mask::$OWNER_PASSWORD"; fi
          node scripts/live-smoke.mjs
