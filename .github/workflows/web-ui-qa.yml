name: Web UI QA

# Renders the panel with the offline dev server and saves desktop + phone
# screenshots of every page to docs/ui-redesign/web for visual review.
on:
  workflow_dispatch:
  push:
    branches: [arena/2e95185a-anoymundo]
    paths:
      - 'web/**'
      - '.github/workflows/web-ui-qa.yml'

permissions:
  contents: write

concurrency:
  group: web-ui-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node scripts/check.mjs
      - name: Install Playwright
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Capture screenshots
        run: node scripts/ui-screenshots.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-ui-screenshots
          path: docs/ui-redesign/web/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit screenshots
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/ui-redesign/web
          git add -f docs/ui-redesign/web || true
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -q -m "Web UI screenshots (run ${{ github.run_number }}) [skip ci]"
          for attempt in 1 2 3 4 5 6 7 8; do
            git push origin HEAD:arena/2e95185a-anoymundo && exit 0
            git pull --rebase -q origin arena/2e95185a-anoymundo || { git rebase --abort; git pull --no-rebase --no-edit -q -X ours origin arena/2e95185a-anoymundo || true; }
            sleep 5
          done
          exit 1
