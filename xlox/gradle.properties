#AndroidIDE: enforce UTF-8 & locale for Gradle daemon
#Mon Jul 27 16:47:21 GMT 2026
android.nonTransitiveRClass=true
systemProp.user.language=en
systemProp.user.country=US
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding\=UTF-8
android.useAndroidX=true

# AGP 8.2.1 predates API 36; it emits an "untested compileSdk" error
# without this suppression. compileSdk does not change runtime behaviour.
android.suppressUnsupportedCompileSdk=36
