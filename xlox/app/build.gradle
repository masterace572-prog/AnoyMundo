plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xlox'
    compileSdk 34

    signingConfigs {
        release {
            storeFile file('xlox.jks')
            storePassword '11111111'
            keyPassword '11111111'
            keyAlias 'key0'
        }
    }

    lint {
        baseline = file('lint-baseline.xml')
        abortOnError false
    }

    defaultConfig {
        applicationId 'com.xlox'
        minSdk 21
        // The virtual-container SDK used by this loader relies on legacy
        // behaviour; raising targetSdk breaks its hidden-API bypass.
        //noinspection OldTargetApi,EditedTargetSdkVersion,ExpiredTargetSdkVersion
        targetSdk 28
        versionCode 2
        versionName '1.0.0'

        vectorDrawables {
            useSupportLibrary true
        }

        ndk {
            abiFilters 'arm64-v8a'
        }

        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }
    ndkVersion '24.0.8215888'
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation fileTree(dir: 'libs', includes: ['*.aar'])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'net.lingala.zip4j:zip4j:2.9.0'
}
