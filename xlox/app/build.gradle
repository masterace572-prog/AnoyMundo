plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xlox'
    // API 36 is needed for android:pageSizeCompat (added in API 36).
    compileSdk 36

    signingConfigs {
        release {
            storeFile file('xlox.jks')
            storePassword '11111111'
            keyPassword '11111111'
            keyAlias 'key0'
        }
    }

    lint {
        baseline = file('lint-baseline.xml')
        abortOnError true
    }

    defaultConfig {
        applicationId 'com.xlox'
        minSdk 21
        // The virtual-container SDK used by this loader relies on legacy
        // behaviour; raising targetSdk breaks its hidden-API bypass.
        //noinspection OldTargetApi,EditedTargetSdkVersion,ExpiredTargetSdkVersion
        targetSdk 28
        // 1.1.0: clean iOS-style light/dark UI, compact progress + dots.
        // 1.0.1: 16 KB page-size support (Android 15+/17) + read-only
        // System.load() so the injected library works on API 37 devices.
        versionCode 4
        versionName '1.1.0'

        vectorDrawables {
            useSupportLibrary true
        }

        ndk {
            abiFilters 'arm64-v8a'
        }

        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path file('src/main/jni/Android.mk')
        }
    }
    ndkVersion '24.0.8215888'
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation fileTree(dir: 'libs', includes: ['*.aar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Already a transitive dependency; pinned so the compat insets API
    // (WindowInsetsControllerCompat / WindowCompat) is guaranteed.
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'net.lingala.zip4j:zip4j:2.9.0'
}
